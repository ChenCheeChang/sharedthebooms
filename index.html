<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>暗夜莊園：驚悚炸彈對決</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #06070c;
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .glass-panel {
      background: linear-gradient(160deg, rgba(16, 19, 32, 0.96), rgba(8, 10, 18, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.88), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .ctrl-btn {
      position: relative;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 25%, rgba(58, 68, 102, 0.95), rgba(16, 20, 36, 0.98));
      border: 2.4px solid rgba(148, 163, 184, 0.48);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.78), inset 0 2px 4px rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
      will-change: transform;
    }
    .ctrl-btn.active-press {
      transform: scale(0.88);
      border-color: #fb7185;
      background: radial-gradient(circle at 30% 25%, rgba(159, 18, 57, 0.98), rgba(45, 12, 28, 1));
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.65), inset 0 2px 6px rgba(255, 255, 255, 0.3);
    }
    .action-bomb-btn {
      background: radial-gradient(circle at 30% 25%, rgba(225, 29, 72, 0.96), rgba(95, 12, 34, 0.99));
      border: 3px solid rgba(251, 113, 133, 0.82);
      box-shadow: 0 8px 22px rgba(225, 29, 72, 0.55), inset 0 2px 6px rgba(255, 255, 255, 0.32);
    }
    .action-bomb-btn.active-press {
      transform: scale(0.88);
      background: radial-gradient(circle at 30% 25%, rgba(244, 63, 94, 1), rgba(159, 18, 57, 1));
      border-color: #ffffff;
    }
    .action-weapon-btn {
      background: radial-gradient(circle at 30% 25%, rgba(124, 58, 237, 0.96), rgba(52, 16, 108, 0.99));
      border: 3px solid rgba(196, 181, 253, 0.82);
      box-shadow: 0 8px 22px rgba(124, 58, 237, 0.55), inset 0 2px 6px rgba(255, 255, 255, 0.32);
    }
    .action-weapon-btn.empty-weapon {
      background: radial-gradient(circle at 30% 25%, rgba(39, 43, 58, 0.78), rgba(15, 18, 28, 0.88));
      border: 2px dashed rgba(148, 163, 184, 0.32);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      opacity: 0.68;
    }
    .char-card {
      transition: transform 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }
    .char-card:hover {
      transform: translateY(-3px);
    }
    .char-card.selected {
      border-color: #f43f5e;
      background: linear-gradient(145deg, rgba(244, 63, 94, 0.28), rgba(15, 23, 42, 0.96));
      box-shadow: 0 0 26px rgba(244, 63, 94, 0.48);
    }
  </style>
</head>
<body class="relative select-none overflow-hidden bg-[#06070c] text-slate-100">

  <!-- Main Fullscreen Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Minimal Top HUD (Icons & Avatars only, no chatty text) -->
  <div id="topHud" class="fixed top-0 left-0 right-0 z-20 pointer-events-none flex items-start justify-between p-2.5 sm:p-4 hidden">
    <!-- 4 Player Alive/Armor Status Pills -->
    <div id="statusStrip" class="flex items-center gap-1.5 sm:gap-2.5 bg-slate-950/90 px-2.5 py-1.5 rounded-full border border-slate-700/60 shadow-xl pointer-events-auto">
    </div>

    <!-- Center 10-Second Countdown Indicator -->
    <div id="countdownBadge" class="hidden pointer-events-none flex flex-col items-center justify-center">
      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-rose-950/95 border-2 border-rose-500 flex items-center justify-center shadow-lg">
        <span id="countdownNum" class="text-2xl sm:text-3xl font-black text-rose-100 tracking-tighter">10</span>
      </div>
    </div>

    <!-- Top Right Utility Circular Buttons (Camera Zoom Toggle & Audio Mute Toggle) -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <button id="btnCameraMode" type="button" aria-label="Toggle Camera" class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-slate-900/90 border border-slate-600/70 flex items-center justify-center text-slate-200 active:scale-90 transition shadow-lg">
        <svg id="iconCameraFollow" class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M21 21l-4.35-4.35M11 8v6M8 11h6" stroke-linecap="round"></path>
        </svg>
        <svg id="iconCameraFull" class="w-5 h-5 text-sky-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <button id="btnAudioToggle" type="button" aria-label="Toggle Audio" class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-slate-900/90 border border-slate-600/70 flex items-center justify-center text-slate-200 active:scale-90 transition shadow-lg">
        <svg id="iconSoundOn" class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linejoin="round"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14" stroke-linecap="round"></path>
        </svg>
        <svg id="iconSoundOff" class="w-5 h-5 text-slate-500 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M11 5L6 9H2v6h4l5 4V5z" stroke-linejoin="round"></path>
          <path d="M23 9l-6 6M17 9l6 6" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Circular Controls Overlay (Strictly Pure Circular Icon Buttons, Zero Extra Text) -->
  <div id="bottomControls" class="fixed bottom-0 left-0 right-0 z-20 pointer-events-none flex items-end justify-between px-4 pb-5 sm:px-8 sm:pb-7 hidden">
    <!-- Left Directional Pad (4 Circular Buttons: Up, Down, Left, Right) -->
    <div id="dpadContainer" class="relative w-40 h-40 sm:w-48 sm:h-48 pointer-events-auto touch-none">
      <!-- Center tactile hub -->
      <div class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-slate-900/75 border border-slate-600/50 pointer-events-none flex items-center justify-center">
        <div class="w-3 h-3 rounded-full bg-slate-500/50"></div>
      </div>

      <!-- UP -->
      <button id="btnUp" type="button" data-dir="up" aria-label="Up" class="ctrl-btn absolute top-0 left-1/2 -translate-x-1/2 w-14 h-14 sm:w-16 sm:h-16">
        <svg class="w-7 h-7 text-slate-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M18 15l-6-6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- DOWN -->
      <button id="btnDown" type="button" data-dir="down" aria-label="Down" class="ctrl-btn absolute bottom-0 left-1/2 -translate-x-1/2 w-14 h-14 sm:w-16 sm:h-16">
        <svg class="w-7 h-7 text-slate-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- LEFT -->
      <button id="btnLeft" type="button" data-dir="left" aria-label="Left" class="ctrl-btn absolute left-0 top-1/2 -translate-y-1/2 w-14 h-14 sm:w-16 sm:h-16">
        <svg class="w-7 h-7 text-slate-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- RIGHT -->
      <button id="btnRight" type="button" data-dir="right" aria-label="Right" class="ctrl-btn absolute right-0 top-1/2 -translate-y-1/2 w-14 h-14 sm:w-16 sm:h-16">
        <svg class="w-7 h-7 text-slate-100 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Right Action Circular Buttons: Weapon Button + Place Bomb Button -->
    <div class="flex items-end gap-3.5 sm:gap-5 pointer-events-auto">
      <!-- Use Weapon Button -->
      <button id="btnWeapon" type="button" aria-label="Use Weapon" class="ctrl-btn action-weapon-btn empty-weapon w-16 h-16 sm:w-20 sm:h-20 relative">
        <svg id="weaponIconEmpty" class="w-7 h-7 sm:w-8 sm:h-8 text-slate-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
        </svg>
        <svg id="weaponIconFlame" class="w-8 h-8 sm:w-10 sm:h-10 text-amber-300 hidden pointer-events-none" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C12 2 6 8.2 6 13.5C6 17.64 8.69 21 12 21C15.31 21 18 17.64 18 13.5C18 11.2 16.9 8.9 15.4 7.2C15.2 9.3 13.8 10.5 13.8 10.5C14.3 7.2 12 2 12 2Z" fill="#f97316" stroke="#fef08a" stroke-width="1.5"/>
          <path d="M12 10.5C12 10.5 9.5 13 9.5 15.5C9.5 17.4 10.6 19 12 19C13.4 19 14.5 17.4 14.5 15.5C14.5 13 12 10.5 12 10.5Z" fill="#fef08a"/>
        </svg>
        <svg id="weaponIconThrow" class="w-8 h-8 sm:w-10 sm:h-10 text-sky-300 hidden pointer-events-none" viewBox="0 0 24 24" fill="none">
          <path d="M3 16C5 8 12 4 20 8" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 2"/>
          <path d="M17 5L20.5 8.2L16.5 10.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="15" r="5.5" fill="#1e293b" stroke="#bae6fd" stroke-width="1.8"/>
          <circle cx="14.5" cy="10.5" r="2" fill="#facc15"/>
        </svg>
        <svg id="weaponIconPowerBomb" class="w-8 h-8 sm:w-10 sm:h-10 text-fuchsia-300 hidden pointer-events-none" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="13" r="7.5" fill="#a21caf" stroke="#f5d0fe" stroke-width="1.6"/>
          <path d="M15.5 7.5L18 5M18 5L20.5 5.5M18 5L18.5 2.5" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
          <path d="M11 8.5L12.2 11.2L15 12L12.2 12.8L11 15.5L9.8 12.8L7 12L9.8 11.2L11 8.5Z" fill="#fde047"/>
        </svg>

        <div id="weaponChargesDots" class="absolute -top-1.5 -right-1 flex gap-1 bg-slate-950/90 px-1.5 py-0.5 rounded-full border border-slate-600/80 hidden pointer-events-none">
        </div>
      </button>

      <!-- Place Bomb Button -->
      <button id="btnBomb" type="button" aria-label="Place Bomb" class="ctrl-btn action-bomb-btn w-20 h-20 sm:w-24 sm:h-24 relative">
        <svg class="w-10 h-10 sm:w-12 sm:h-12 text-white pointer-events-none" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="13.5" r="7.5" fill="#1e1b2e" stroke="#fecdd3" stroke-width="2"/>
          <circle cx="8.5" cy="11" r="2" fill="#fda4af" opacity="0.7"/>
          <path d="M14.5 6.5L16.5 4.5C17.8 3.2 19.5 3.8 20 5" stroke="#fde047" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="20" cy="5" r="2.2" fill="#facc15"/>
        </svg>
        <div id="powerBombRing" class="absolute inset-0 rounded-full border-2 border-fuchsia-400 hidden pointer-events-none"></div>
      </button>
    </div>
  </div>

  <!-- Character Selection Screen Modal -->
  <div id="selectScreen" class="fixed inset-0 z-30 flex items-center justify-center p-3 sm:p-6 bg-black/90 overflow-y-auto">
    <div class="glass-panel w-full max-w-2xl rounded-3xl p-4 sm:p-7 flex flex-col items-center border border-rose-500/35 my-auto">
      <div class="flex items-center gap-2.5 mb-1">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
        <span class="text-xs sm:text-sm font-bold tracking-widest uppercase text-rose-400">2D 俯視驚悚動作對戰・精裝旗艦版</span>
      </div>
      <h1 class="text-2xl sm:text-4xl font-black text-white tracking-tight text-center mb-1">暗夜莊園：最後生還者</h1>
      <p class="text-xs sm:text-sm text-slate-300 text-center mb-4 sm:mb-5">全細節角色肢體動作・八大精裝室內空間・炸毀家具與每 10 秒空投補給</p>

      <!-- 4 Distinct Chibi Characters Grid -->
      <div id="charGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-4 w-full mb-5">
      </div>

      <!-- Weapon & Rule Quick Visual Legend -->
      <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-900/85 rounded-2xl p-2.5 sm:p-3.5 border border-slate-800 mb-5 text-xs">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-orange-500/20 border border-orange-400/40 flex items-center justify-center shrink-0 text-orange-300 font-bold">🔥</div>
          <div>
            <div class="font-bold text-slate-200">火槍 (3次)</div>
            <div class="text-[11px] text-slate-400">雙手噴射5格火焰</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-sky-500/20 border border-sky-400/40 flex items-center justify-center shrink-0 text-sky-300 font-bold">🧤</div>
          <div>
            <div class="font-bold text-slate-200">投彈手套 (3次)</div>
            <div class="text-[11px] text-slate-400">舉起炸彈遠投4格</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-fuchsia-500/20 border border-fuchsia-400/40 flex items-center justify-center shrink-0 text-fuchsia-300 font-bold">💣</div>
          <div>
            <div class="font-bold text-slate-200">強化炸彈 (3次)</div>
            <div class="text-[11px] text-slate-400">十字半徑4格・炸毀家具</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center shrink-0 text-emerald-300 font-bold">🦺</div>
          <div>
            <div class="font-bold text-slate-200">防護衣 (穿戴)</div>
            <div class="text-[11px] text-slate-400">受擊自動脫落保命一次</div>
          </div>
        </div>
      </div>

      <button id="btnStartGame" type="button" class="w-full sm:w-72 py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r from-rose-600 via-red-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-black text-base sm:text-lg tracking-wider shadow-lg active:scale-95 transition">
        進入莊園對決
      </button>
    </div>
  </div>

  <!-- Game Over / Victory Screen Modal -->
  <div id="resultScreen" class="fixed inset-0 z-30 hidden items-center justify-center p-4 bg-black/90">
    <div class="glass-panel w-full max-w-md rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center border border-slate-700/60">
      <div id="resultBadge" class="w-32 h-32 rounded-full flex items-center justify-center mb-3 shadow-2xl bg-slate-900/90 border border-slate-700">
        <canvas id="resultAvatarCanvas" width="128" height="128"></canvas>
      </div>
      <h2 id="resultTitle" class="text-2xl sm:text-3xl font-black text-white mb-1">最後生還者</h2>
      <p id="resultSubtitle" class="text-sm text-slate-300 mb-6"></p>

      <div class="flex gap-3 w-full">
        <button id="btnChangeChar" type="button" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-600/60 active:scale-95 transition">
          更換角色
        </button>
        <button id="btnPlayAgain" type="button" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-black text-sm shadow-lg active:scale-95 transition">
          再次挑戰
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. LOUDER, SINISTER HORROR BGM & SOUND ENGINE (Web Audio API + Compressor)
    //    - 30-second looping spine-chilling horror BGM (Harmonic Minor + Tritone)
    //    - Boosted volume via Master Compressor so mobile speakers sound rich & eerie
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.compressor = null;
        this.muted = false;
        this.bgmPlaying = false;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.noiseBuffer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.setValueAtTime(-14, this.ctx.currentTime);
            this.compressor.knee.setValueAtTime(12, this.ctx.currentTime);
            this.compressor.ratio.setValueAtTime(4, this.ctx.currentTime);
            this.compressor.attack.setValueAtTime(0.005, this.ctx.currentTime);
            this.compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(1.45, this.ctx.currentTime);
            this.masterGain.connect(this.compressor);
            this.compressor.connect(this.ctx.destination);

            const bufferSize = Math.floor(this.ctx.sampleRate * 0.42);
            this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = this.noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.14));
            }
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      toggleMute() {
        this.init();
        this.muted = !this.muted;
        if (this.muted) {
          this.stopBGM();
        } else if (gameState.phase === 'countdown' || gameState.phase === 'fadein' || gameState.phase === 'battle') {
          this.startBGM();
        }
        return this.muted;
      }

      // Sinister 30-second looping Horror Manor BGM (120 steps * 250ms = 30.0s exact loop)
      startBGM() {
        this.init();
        if (this.muted || !this.ctx) return;
        this.stopBGM();
        this.bgmPlaying = true;
        this.bgmStep = 0;

        // Sinister C Harmonic Minor + Locrian Tritone (Gb = 369.99Hz, B = 493.88Hz, Ab = 415.30Hz)
        const eerieNotes = [
          // Section A (0s-7.5s): Creepy haunted music box with tritone intervals
          523.25, 0, 622.25, 493.88, 523.25, 0, 369.99, 0,
          415.30, 0, 392.00, 0, 369.99, 392.00, 311.13, 0,
          523.25, 0, 622.25, 493.88, 739.99, 0, 698.46, 0,
          622.25, 493.88, 523.25, 0, 415.30, 0, 369.99, 0,
          // Section B (7.5s-15s): Descending chromatic dread & clockwork tension
          698.46, 659.25, 622.25, 0, 554.37, 523.25, 493.88, 0,
          466.16, 415.30, 392.00, 369.99, 392.00, 0, 261.63, 0,
          783.99, 0, 739.99, 0, 622.25, 0, 554.37, 0,
          523.25, 493.88, 415.30, 392.00, 369.99, 0, 0, 0,
          // Section C (15s-22.5s): High phantom shrieks & dissonant bell tolls
          1046.50, 0, 987.77, 0, 830.61, 0, 739.99, 0,
          783.99, 0, 622.25, 0, 554.37, 0, 493.88, 0,
          932.33, 0, 830.61, 0, 739.99, 0, 622.25, 0,
          523.25, 493.88, 415.30, 0, 369.99, 0, 392.00, 0,
          // Section D (22.5s-30s): Deep organ climax & sinister resolution
          622.25, 554.37, 523.25, 493.88, 415.30, 392.00, 369.99, 0,
          311.13, 369.99, 392.00, 415.30, 493.88, 0, 392.00, 0,
          523.25, 0, 493.88, 0, 369.99, 0, 261.63, 0
        ];

        // Deep ominous sub-bass + pipe organ tritone roots
        const bassProgression = [
          65.41, 61.74, 55.00, 46.25, // C1 - B0 - A0 - F#0 (Tritone plunge!)
          51.91, 49.00, 46.25, 49.00, // Ab0 - G0 - F#0 - G0
          65.41, 69.30, 61.74, 51.91, // C1 - Db1 - B0 - Ab0
          46.25, 49.00, 41.20, 49.00  // F#0 - G0 - E0 - G0
        ];

        const tick = () => {
          if (!this.bgmPlaying || this.muted || !this.ctx || this.ctx.state !== 'running') return;
          const now = this.ctx.currentTime;
          const step = this.bgmStep % 120;

          // 1. Loud Ominous Dark Pipe Organ & Sub-Bass Drone every 8 steps (2.0s)
          if (step % 8 === 0) {
            const rootFreq = bassProgression[Math.floor(step / 8) % bassProgression.length];
            const oscSub = this.ctx.createOscillator();
            const oscOrgan = this.ctx.createOscillator();
            const oscTritone = this.ctx.createOscillator();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();

            oscSub.type = 'sawtooth';
            oscOrgan.type = 'square';
            oscTritone.type = 'sawtooth';

            oscSub.frequency.setValueAtTime(rootFreq, now);
            oscOrgan.frequency.setValueAtTime(rootFreq * 2, now);
            // Sinister diminished 5th (tritone) overtone
            oscTritone.frequency.setValueAtTime(rootFreq * 2.828, now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(340, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.24, now + 0.18);
            gain.gain.exponentialRampToValueAtTime(0.015, now + 1.98);

            oscSub.connect(filter);
            oscOrgan.connect(filter);
            oscTritone.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);

            oscSub.start(now);
            oscOrgan.start(now);
            oscTritone.start(now);
            oscSub.stop(now + 2.02);
            oscOrgan.stop(now + 2.02);
            oscTritone.stop(now + 2.02);
          }

          // 2. Heavy Double Heartbeat Thud (Steps 0 and 2 of every 8-step bar)
          if (step % 8 === 0 || step % 8 === 2) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(92, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.21);
            gain.gain.setValueAtTime(step % 8 === 0 ? 0.34 : 0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.24);
          }

          // 3. Ghostly Theremin Wail on every 16th step
          if (step % 16 === 6) {
            const wail = this.ctx.createOscillator();
            const wGain = this.ctx.createGain();
            wail.type = 'sine';
            wail.frequency.setValueAtTime(622.25, now);
            wail.frequency.linearRampToValueAtTime(587.33, now + 0.6);
            wail.frequency.linearRampToValueAtTime(659.25, now + 1.2);
            wGain.gain.setValueAtTime(0.001, now);
            wGain.gain.linearRampToValueAtTime(0.09, now + 0.4);
            wGain.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
            wail.connect(wGain);
            wGain.connect(this.masterGain);
            wail.start(now);
            wail.stop(now + 1.5);
          }

          // 4. Detuned Creepy Music Box Melody (Loud & Clear)
          const note = eerieNotes[step];
          if (note && note > 0) {
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc1.type = 'triangle';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(note, now);
            // Creepy out-of-tune music box dissonance (1.5% sharp detune)
            osc2.frequency.setValueAtTime(note * 1.012, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.002, now + 0.68);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(this.masterGain);
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.7);
            osc2.stop(now + 0.7);
          }

          this.bgmStep = (this.bgmStep + 1) % 120;
        };

        tick();
        this.bgmTimer = setInterval(tick, 250);
      }

        this.bgmPlaying = false;

      const s = TILE_SIZE;

      for (let r = 0; r < GRID_ROWS; r++) {

      // Warm Sconce Light Pools

        { x: 20.5 * s, y: 8.2 * s },

        { x: 12.5 * s, y: 12.2 * s },

      ];
      torchSpots.forEach(wt => {
        const r = s * 2.2;

        tGrad.addColorStop(0, 'rgba(254, 240, 138, 0.22)');

    function stampScorchMarkOnStaticMap(x, y, r) {
      const ctx = staticMapCtx;
      ctx.save();
      const grad = ctx.createRadialGradient(x, y, 2, x, y, r);
      grad.addColorStop(0, 'rgba(8, 8, 12, 0.72)');
      grad.addColorStop(0.6, 'rgba(28, 18, 22, 0.40)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // =========================================================================

    const WEAPON_DEFS = {
      flame:      { id: 'flame',      name: '火槍',     charges: 3, color: '#f97316' },
      throwglove: { id: 'throwglove', name: '投彈手套', charges: 3, color: '#38bdf8' },

    const gameState = {

      selectedCharId: 0,
      countdownTimer: 10.0,
      fadeTimer: 0,
      cameraMode: 'follow',
      players: [],
      bombs: [],
      thrownBombs: [],
