    function drawTacticalArmorVest(ctx, isReinforced = false, splitOffset = 0) {
      ctx.save();
      const mainColor = isReinforced ? '#eab308' : '#0284c7';
      const plateColor = isReinforced ? '#fef08a' : '#38bdf8';
      const trimColor = '#e2e8f0';

      ctx.save();
      ctx.translate(-splitOffset, 0);
      ctx.fillStyle = mainColor;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(-11.5, -3.5, 5.8, 4.6, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(-11.5, -4.5, 11.5, 14.5, 3.5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.roundRect(-9.8, -3, 8.8, 11.5, 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(splitOffset, 0);
      ctx.fillStyle = mainColor;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(11.5, -3.5, 5.8, 4.6, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(0, -4.5, 11.5, 14.5, 3.5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.roundRect(1, -3, 8.8, 11.5, 2);
      ctx.fill();
      ctx.restore();

      if (splitOffset < 4) {
        ctx.fillStyle = trimColor;
        ctx.fillRect(-10.5, 1.5, 21, 2.5);
        ctx.fillStyle = plateColor;
        ctx.beginPath();
        ctx.arc(0, 2.7, 4.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
      ctx.restore();
    }

    // Helper: Draw Articulated Hand with Visible Palm (手掌) and 5 Spread Fingers (五根手指)!
    function drawArticulatedHandAndFingers(ctx, hx, hy, angle, skinColor, isGloved = false) {
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(angle);

      const handFill = isGloved ? '#38bdf8' : skinColor;
      ctx.fillStyle = handFill;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 1.25;

      // 5 Distinct Fingers fanning out from the palm!
      // Thumb (大拇指) + Index, Middle, Ring, Pinky (食指、中指、無名指、小指)
      const fingerSpecs = [
        { ang: -0.75, len: 3.8, w: 1.5, ox: -2.2, oy: -0.5 }, // Thumb
        { ang: -0.32, len: 4.5, w: 1.4, ox: -1.6, oy: -2.2 }, // Index
        { ang: -0.04, len: 5.0, w: 1.4, ox:  0.0, oy: -2.5 }, // Middle
        { ang:  0.24, len: 4.4, w: 1.35, ox: 1.5, oy: -2.2 }, // Ring
        { ang:  0.52, len: 3.6, w: 1.25, ox: 2.6, oy: -1.4 }  // Pinky
      ];

      fingerSpecs.forEach(f => {
        ctx.save();
        ctx.translate(f.ox, f.oy);
        ctx.rotate(f.ang);
        ctx.beginPath();
        ctx.roundRect(-f.w / 2, -f.len, f.w, f.len + 1.2, f.w / 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Rounded Palm (手掌) with subtle palm crease
      ctx.beginPath();
      ctx.ellipse(0, 0, 3.6, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Palm lifeline crease detail
      ctx.strokeStyle = isGloved ? '#0284c7' : 'rgba(120, 53, 15, 0.45)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.arc(0.4, 0.5, 1.6, 0.2 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // =========================================================================
    // 14. ULTRA-DETAILED CHARACTER RENDERER (4.0)
    //     Clearly shows:
    //     - Layered clothing (Shirt collar, Waistcoat, Open Coat Lapels, Hem & Belt)
    //     - Pants / Trousers (褲子: articulated thighs, knees & cuffs)
    //     - Shoes / Boots (鞋子: heels, thick soles, toe caps & buckles)
    //     - Palms & 5 Fingers (手掌與五指)
    //     - Full Dynamic Action Poses (Walking stride, Bomb Throw Windup, Flame Bracing)
    // =========================================================================
    function drawChibiCharacter(ctx, x, y, scale, charDef, state) {
      if (state.opacity <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = state.opacity;
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const isMoving = !!state.isMoving;
      const walkSin = isMoving ? Math.sin(state.walkCycle || 0) : 0;
      const walkCos = isMoving ? Math.cos(state.walkCycle || 0) : 0;
      const bob = isMoving ? Math.abs(walkSin) * -3.4 : Math.sin(performance.now() * 0.004) * -0.8;
      const stride = walkSin * 6.8;
      const armSwing = walkSin * 6.2;

      // Dynamic lean in movement direction
      const leanX = isMoving && state.dir ? state.dir.x * 2.2 : 0;

      // 1. Ground Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.beginPath();
      ctx.ellipse(0, 22, 17, 6.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Flowing Multi-Pleated Outer Cape
      ctx.save();
      ctx.translate(leanX * 0.5, bob);
      const capeSway = walkSin * 3.8 - leanX * 1.2;
      ctx.fillStyle = charDef.capeColor || charDef.secondary;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(-10, -4);
      ctx.quadraticCurveTo(-18 + capeSway, 6, -15 + capeSway, 15.5);
      ctx.lineTo(-5 + capeSway * 0.6, 13.5);
      ctx.lineTo(5 + capeSway * 0.6, 15.5);
      ctx.lineTo(15 + capeSway, 15.5);
      ctx.quadraticCurveTo(18 + capeSway, 6, 10, -4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 3. VISIBLE PANTS / TROUSERS (褲子) & ARTICULATED SHOES (鞋子) WITH WALKING STRIDE!
      const leftLegY = stride * 0.55;
      const rightLegY = -stride * 0.55;
      const leftKneeLift = stride < 0 ? Math.abs(stride) * 0.35 : 0;
      const rightKneeLift = stride > 0 ? Math.abs(stride) * 0.35 : 0;

      [
        { side: -1, lx: -5.4, ly: leftLegY, lift: leftKneeLift },
        { side:  1, lx:  5.4, ly: rightLegY, lift: rightKneeLift }
      ].forEach(leg => {
        ctx.save();
        ctx.translate(leg.lx + leanX * 0.4, 8 + bob * 0.4);

        // Trouser Leg (褲管與膝部摺痕)
        ctx.fillStyle = charDef.pantsColor || '#1e293b';
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(-3.6, 0, 7.2, 8.5 + leg.ly * 0.4 - leg.lift, 2.5);
        ctx.fill();
        ctx.stroke();

        // Trouser cuff trim (褲腳滾邊)
        ctx.fillStyle = charDef.accent;
        ctx.fillRect(-3.4, 6.5 + leg.ly * 0.4 - leg.lift, 6.8, 1.5);

        // Detailed Shoe / Boot (鞋子：鞋筒、鞋頭高光、厚鞋底與鞋釦)
        const sy = 9.5 + leg.ly * 0.5 - leg.lift;
        ctx.translate(leg.side * 0.6, sy);
        ctx.rotate(leg.ly * 0.03);

        // Thick Shoe Sole (鞋底與鞋跟)
        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.roundRect(-4.6, 1.2, 9.6, 3.2, 1.5);
        ctx.fill();

        // Shoe Upper Body (鞋面)
        ctx.fillStyle = charDef.shoeColor || '#451a03';
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 1.7;
        ctx.beginPath();
        ctx.ellipse(0.2, 0.2, 4.8, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Shoe Toe Cap Specular Shine (鞋頭亮面高光)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
        ctx.beginPath();
        ctx.ellipse(1.5, -0.6, 2.0, 1.1, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // Gold Shoe Buckle / Laces (鞋釦)
        ctx.fillStyle = charDef.accent;
        ctx.fillRect(-1.5, -1.8, 3.2, 2.0);
        ctx.restore();
      });

      ctx.translate(leanX, bob);

      // 4. MULTI-LAYERED CLOTHING TORSO (服裝造型層次感：內襯領口 + 馬甲背心 + 外套大衣翻領 + 腰帶)
      // Layer A: Inner Waistcoat / Vest (內層馬甲背心)
      ctx.fillStyle = charDef.vestColor || charDef.secondary;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.roundRect(-9.5, -6, 19, 16, 4);
      ctx.fill();
      ctx.stroke();

      // Layer B: Crisp Inner Shirt V-Collar & Tie/Cravat (高明度內襯領口與領結)
      ctx.fillStyle = charDef.shirtColor || '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-4.5, -6);
      ctx.lineTo(4.5, -6);
      ctx.lineTo(0, 1.5);
      ctx.closePath();
      ctx.fill();

      // Cravat / Bowtie / Cross Ribbon
      ctx.fillStyle = charDef.hatType === 'nurse' ? '#e11d48' : charDef.accent;
      ctx.beginPath();
      ctx.arc(0, -3.5, 2.4, 0, Math.PI * 2);
      ctx.fill();

      // Layer C: Tailored Outer Coat Left & Right Panels with Split Hem & Lapels (外層大衣與翻領)
      ctx.fillStyle = charDef.primary;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 2.0;

      // Left Coat Panel & Lapel
      ctx.beginPath();
      ctx.moveTo(-8, -6.5);
      ctx.lineTo(-3, -6.5);
      ctx.lineTo(-3.5, 11.5);
      ctx.lineTo(-11.5, 11.5);
      ctx.quadraticCurveTo(-12.5, 1, -8, -6.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Right Coat Panel & Lapel
      ctx.beginPath();
      ctx.moveTo(3, -6.5);
      ctx.lineTo(8, -6.5);
      ctx.quadraticCurveTo(12.5, 1, 11.5, 11.5);
      ctx.lineTo(3.5, 11.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Layer D: Tailored Leather Belt, Gold Buckle & Coat Buttons
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-10.5, 4.2, 21, 3.2);
      ctx.strokeStyle = charDef.accent;
      ctx.lineWidth = 1.6;
      ctx.strokeRect(-2.6, 3.8, 5.2, 4.0);

      // Gold Coat Buttons on both panels
      ctx.fillStyle = charDef.accent;
      [-5.5, 5.5].forEach(bx => {
        ctx.beginPath();
        ctx.arc(bx, -1, 1.3, 0, Math.PI * 2);
        ctx.arc(bx, 2.2, 1.3, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. EXPLICITLY WORN PHYSICAL ARMOR VEST ON TORSO (when armor > 0)
      if (state.armor > 0) {
        drawTacticalArmorVest(ctx, state.armor > 1, 0);
        ctx.strokeStyle = state.armor > 1 ? 'rgba(250, 204, 21, 0.78)' : 'rgba(56, 189, 248, 0.72)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, -1, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 6. ARTICULATED ARMS, SLEEVE CUFFS, PALMS & 5 FINGERS (手袖、手掌與五根手指 + 動作演出!)
      const isThrowing = state.actionPoseTimer > 0 && state.actionPoseType === 'throw';
      const isFlaming = state.actionPoseTimer > 0 && state.actionPoseType === 'flame';
      const isPlacing = state.actionPoseTimer > 0 && state.actionPoseType === 'place';

      if (state.heldBomb) {
        // Pose: Both arms raised high overhead gripping a bomb with spread fingers!
        [-11, 11].forEach((ax, idx) => {
          ctx.save();
          ctx.fillStyle = charDef.primary;
          ctx.strokeStyle = '#07080d';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.roundRect(ax - 3, -18, 6, 13, 3);
          ctx.fill();
          ctx.stroke();
          drawArticulatedHandAndFingers(
            ctx,
            ax * 0.92,
            -22,
            idx === 0 ? 0.35 : -0.35,
            charDef.skin,
            state.weapon === 'throwglove'
          );
          ctx.restore();
        });
      } else {
        // Left & Right Articulated Sleeves + Palms + 5 Fingers
        const leftArmY = isThrowing ? -8 : isFlaming ? -2 : armSwing * 0.55;
        const rightArmY = isThrowing ? -11 : isFlaming ? -2 : -armSwing * 0.55;
        const leftAngle = isThrowing ? -0.8 : -0.35 + walkSin * 0.25;
        const rightAngle = isThrowing ? 0.9 : 0.35 - walkSin * 0.25;

        // Left Arm Sleeve + Cuff + Hand with 5 Fingers
        ctx.save();
        ctx.translate(-12.5, -2 + leftArmY * 0.5);
        ctx.rotate(leftAngle * 0.4);
        ctx.fillStyle = charDef.primary;
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(-3.2, -3, 6.4, 9, 3);
        ctx.fill();
        ctx.stroke();
        // White sleeve cuff
        ctx.fillStyle = charDef.shirtColor || '#ffffff';
        ctx.fillRect(-2.8, 4.5, 5.6, 2);
        drawArticulatedHandAndFingers(ctx, -1, 8.5, 0.25, charDef.skin, state.weapon === 'throwglove');
        ctx.restore();

        // Right Arm Sleeve + Cuff + Hand with 5 Fingers (& Equipped Weapon)
        ctx.save();
        ctx.translate(12.5, -2 + rightArmY * 0.5);
        ctx.rotate(rightAngle * 0.4);
        ctx.fillStyle = charDef.primary;
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(-3.2, -3, 6.4, 9, 3);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = charDef.shirtColor || '#ffffff';
        ctx.fillRect(-2.8, 4.5, 5.6, 2);
        drawArticulatedHandAndFingers(ctx, 1, 8.5, -0.25, charDef.skin, state.weapon === 'throwglove');

        if (state.weapon === 'flame') {
          ctx.fillStyle = '#ea580c';
          ctx.strokeStyle = '#07080d';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.roundRect(0, 5, 12, 6.5, 2.5);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(13, 8.2, 3, 0, Math.PI * 2);
          ctx.fill();
        } else if (state.weapon === 'powerbomb') {
          ctx.fillStyle = '#c026d3';
          ctx.strokeStyle = '#f5d0fe';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(4, 9, 5.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      }

      // 7. SCULPTED HEAD, EARS, HAIR STRANDS & EXPRESSIVE EYES
      if (charDef.hatType === 'nurse') {
        ctx.fillStyle = charDef.hairColor;
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 2;
        [-15.5, 15.5].forEach((tx, idx) => {
          ctx.beginPath();
          ctx.ellipse(tx, -8, 4.8, 9.8, idx === 0 ? 0.35 : -0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#fb7185';
          ctx.beginPath();
          ctx.arc(tx * 0.82, -13.5, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = charDef.hairColor;
        });
      }

      // Ears
      ctx.fillStyle = charDef.skin;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(-13.2, -10, 3.3, 0, Math.PI * 2);
      ctx.arc(13.2, -10, 3.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Head Base
      ctx.fillStyle = charDef.skin;
      ctx.strokeStyle = '#07080d';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, -11.2, 13.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Layered Hair Bangs + Gloss Highlight
      ctx.fillStyle = charDef.hairColor;
      ctx.beginPath();
      ctx.arc(0, -13.2, 13.0, Math.PI * 1.05, Math.PI * 1.95);
      ctx.lineTo(10, -10.5);
      ctx.lineTo(6, -14.8);
      ctx.lineTo(2, -10.5);
      ctx.lineTo(-2, -15.0);
      ctx.lineTo(-6, -10.5);
      ctx.lineTo(-10, -14.0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.30)';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -13.5, 9.6, Math.PI * 1.2, Math.PI * 1.65);
      ctx.stroke();

      const lookX = (state.dir ? state.dir.x : 0) * 2.6;
      const lookY = (state.dir ? state.dir.y : 1) * 1.5;

      [-5.2, 5.2].forEach((ex, idx) => {
        ctx.strokeStyle = charDef.hairColor;
        ctx.lineWidth = 1.9;
        ctx.beginPath();
        ctx.moveTo(ex + lookX - 3.3, -14.0 + lookY + (idx === 0 ? 0.5 : -0.5));
        ctx.lineTo(ex + lookX + 3.3, -14.0 + lookY + (idx === 0 ? -0.5 : 0.5));
        ctx.stroke();

        if (state.blinking) {
          ctx.strokeStyle = '#07080d';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(ex + lookX, -9.6 + lookY, 3, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(ex + lookX, -9.6 + lookY, 3.5, 4.0, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#07080d';
          ctx.beginPath();
          ctx.ellipse(ex + lookX, -9.6 + lookY, 3.0, 3.6, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = charDef.eyeColor;
          ctx.beginPath();
          ctx.arc(ex + lookX, -9.0 + lookY, 2.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#090d16';
          ctx.beginPath();
          ctx.arc(ex + lookX, -9.0 + lookY, 1.0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ex + lookX - 1.0, -10.6 + lookY, 1.3, 0, Math.PI * 2);
          ctx.arc(ex + lookX + 1.0, -8.0 + lookY, 0.65, 0, Math.PI * 2);
          ctx.fill();
        }

        if (charDef.hatType === 'detective' && idx === 1) {
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(ex + lookX, -9.6 + lookY, 4.8, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      ctx.fillStyle = 'rgba(244, 63, 94, 0.42)';
      ctx.beginPath();
      ctx.ellipse(-8.2 + lookX * 0.4, -6.5 + lookY * 0.4, 2.6, 1.4, 0, 0, Math.PI * 2);
      ctx.ellipse(8.2 + lookX * 0.4, -6.5 + lookY * 0.4, 2.6, 1.4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      if (isThrowing || isFlaming || isPlacing) {
        // Determined action mouth ("O" expression)
        ctx.fillStyle = '#9f1239';
        ctx.arc(lookX * 0.6, -5.2 + lookY * 0.5, 2.0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.arc(lookX * 0.6, -5.8 + lookY * 0.5, 1.8, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }

      // 8. Signature Headwear
      if (charDef.hatType === 'detective') {
        ctx.fillStyle = '#1e3a8a';
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, -19.5, 15.8, 5.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#2563eb';
        ctx.beginPath();
        ctx.arc(0, -20.5, 11.2, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-10, -21.5, 20, 3);
      } else if (charDef.hatType === 'nurse') {
        ctx.fillStyle = '#fff1f2';
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-11, -28, 22, 10, 4.5);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#e11d48';
        ctx.fillRect(-1.7, -26, 3.4, 6.8);
        ctx.fillRect(-4, -23.8, 8, 2.5);
      } else if (charDef.hatType === 'jester') {
        ctx.fillStyle = '#7e22ce';
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-12, -18.5);
        ctx.quadraticCurveTo(-20, -31.5, -5, -27);
        ctx.lineTo(0, -20.5);
        ctx.lineTo(5, -27);
        ctx.quadraticCurveTo(20, -31.5, 12, -18.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(-14, -27, 3.4, 0, Math.PI * 2);
        ctx.arc(14, -27, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (charDef.hatType === 'witch') {
        ctx.fillStyle = '#065f46';
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, -19.5, 16, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-10, -19.5);
        ctx.lineTo(2.5, -34.5);
        ctx.lineTo(10, -19.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f97316';
        ctx.fillRect(-9, -22, 18, 3.4);
      }

      // Draw Lifted Bomb overhead if holding one
      if (state.heldBomb) {
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#fb7185';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(0, -35, 12.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(6, -45, 3.8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawAscensionEffect(ctx, asc) {
      const progress = Math.min(1, asc.timer / asc.duration);
      const alpha = progress < 0.8 ? 1 : (1 - progress) / 0.2;

      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.fillStyle = 'rgba(253, 224, 71, 0.25)';
      ctx.beginPath();
      ctx.moveTo(asc.x - 18, asc.startY - 220);
      ctx.lineTo(asc.x + 18, asc.startY - 220);
      ctx.lineTo(asc.x + 34, asc.startY + 20);
      ctx.lineTo(asc.x - 34, asc.startY + 20);
      ctx.closePath();
      ctx.fill();

      const wingFlap = Math.sin(asc.timer * 15) * 0.36;
      ctx.save();
      ctx.translate(asc.x, asc.y - 6);

      ctx.save();
      ctx.rotate(-0.3 + wingFlap);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(-20, 0, 16, 8, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.rotate(0.3 - wingFlap);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(20, 0, 16, 8, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();

      drawChibiCharacter(ctx, asc.x, asc.y, 1.15, asc.charDef, {
        dir: { x: 0, y: 1 },
        walkCycle: 0,
        isMoving: false,
        armor: 0,
        opacity: alpha * 0.88,
        weapon: null,
        blinking: true
      });

      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.ellipse(asc.x, asc.y - 40, 12, 4.2, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function renderScene() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      ctx.clearRect(0, 0, vw, vh);

      ctx.fillStyle = '#06070c';
      ctx.fillRect(0, 0, vw, vh);

      const worldW = GRID_COLS * TILE_SIZE;
      const worldH = GRID_ROWS * TILE_SIZE;
      const userPlayer = gameState.players.find(p => !p.isAI) || gameState.players[0];

      const fitZoom = Math.min((vw - 16) / worldW, (vh - 120) / worldH);
      const followZoom = Math.max(fitZoom * 1.52, Math.min(vw, vh) / (TILE_SIZE * 8.4));

      const targetZoom = gameState.cameraMode === 'full' ? fitZoom : followZoom;
      camera.zoom += (targetZoom - camera.zoom) * 0.16;

      if (userPlayer) {
        const targetX = gameState.cameraMode === 'full' ? worldW / 2 : userPlayer.x;
        const targetY = gameState.cameraMode === 'full' ? worldH / 2 + 24 : userPlayer.y + 18;
        camera.x += (targetX - camera.x) * 0.18;
        camera.y += (targetY - camera.y) * 0.18;
      }

      const nowSec = performance.now() * 0.001;

      ctx.save();
      ctx.translate(vw / 2, vh / 2);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);

      // 1. Single Blit of Pre-Baked Static Map
      ctx.drawImage(staticMapCanvas, 0, 0);

      // 2. Draw Remaining Destructible Furniture from Sprite Cache
      for (const key in furnitureMap) {
        const fObj = furnitureMap[key];
        const parts = key.split(',');
        const c = parseInt(parts[0], 10);
        const r = parseInt(parts[1], 10);
        const sprite = furnitureSprites[fObj.type];
        if (sprite) {
          ctx.drawImage(sprite, c * TILE_SIZE, r * TILE_SIZE);
        }
      }

      // 3. Draw Revealed / Dropped Weapons & Armor Pickups
      for (let i = 0; i < gameState.items.length; i++) {
        const item = gameState.items[i];
        const ix = (item.col + 0.5) * TILE_SIZE;
        const iy = (item.row + 0.5) * TILE_SIZE + Math.sin(nowSec * 3.8 + item.bobPhase) * 3.5;
        const def = WEAPON_DEFS[item.type];
        if (!def) continue;
        const sc = item.spawnScale || 1;

        ctx.save();
        ctx.translate(ix, iy);
        ctx.scale(sc, sc);

        ctx.fillStyle = def.color;
        ctx.globalAlpha = 0.24;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.arc(0, 0, 18.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (item.type === 'flame') {
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(0, 2, 8.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(0, 3, 4.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'throwglove') {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(-2, 2, 7.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(3, -3, 5.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(6, -7, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'powerbomb') {
          ctx.fillStyle = '#d946ef';
          ctx.beginPath();
          ctx.arc(0, 1, 8.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(0, 1, 3.8, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'armor') {
          drawTacticalArmorVest(ctx, false, 0);
        }
        ctx.restore();
      }

      // 4. Draw Active Bombs on Ground
      for (let i = 0; i < gameState.bombs.length; i++) {
        const b = gameState.bombs[i];
        const pulse = 1 + Math.sin((b.maxTimer - b.timer) * 15) * 0.13;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(pulse, pulse);

        ctx.fillStyle = 'rgba(0,0,0,0.52)';
        ctx.beginPath();
        ctx.ellipse(0, 16, 16, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = b.isPower ? '#701a75' : '#0f172a';
        ctx.strokeStyle = b.isPower ? '#f5d0fe' : '#fb7185';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.beginPath();
        ctx.arc(-6, -6, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(10, -16, 5 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. Draw Bomb Cross Explosions
      for (let i = 0; i < gameState.explosions.length; i++) {
        const ex = gameState.explosions[i];
        const alpha = Math.min(1, (ex.timer / ex.maxTimer) * 1.45);
        ctx.save();
        ctx.globalAlpha = alpha;
        for (let j = 0; j < ex.cells.length; j++) {
          const c = ex.cells[j];
          const cx = (c.col + 0.5) * TILE_SIZE;
          const cy = (c.row + 0.5) * TILE_SIZE;

          ctx.fillStyle = ex.isPower ? '#d946ef' : '#f97316';
          ctx.beginPath();
          ctx.roundRect(c.col * TILE_SIZE + 4, c.row * TILE_SIZE + 4, TILE_SIZE - 8, TILE_SIZE - 8, 12);
          ctx.fill();

          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(cx, cy, TILE_SIZE * 0.28, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // 6. Draw Flamethrower Streams
      for (let i = 0; i < gameState.flameStreams.length; i++) {
        const fs = gameState.flameStreams[i];
        const alpha = Math.min(1, (fs.timer / fs.maxTimer) * 1.5);
        ctx.save();
        ctx.globalAlpha = alpha;
        for (let j = 0; j < fs.cells.length; j++) {
          const c = fs.cells[j];
          const cx = (c.col + 0.5) * TILE_SIZE;
          const cy = (c.row + 0.5) * TILE_SIZE;
          const r = TILE_SIZE * (0.36 + (j / 5) * 0.08);
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // 7. Draw Detached Physical Armor Vests
      for (let i = 0; i < gameState.detachedArmors.length; i++) {
        const da = gameState.detachedArmors[i];
        ctx.save();
        ctx.globalAlpha = Math.min(1, da.life / 0.5);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(da.x, da.y + 10, 14, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(da.x, da.y - da.z);
        ctx.rotate(da.rot);
        ctx.scale(1.25, 1.25);
        drawTacticalArmorVest(ctx, false, da.splitProgress * 4.5);
        ctx.restore();
      }

      // 8. Draw Alive Characters (Prominent 1.28x Scale so fingers, shoes, trousers & layered outfits are crystal clear!)
      const sortedPlayers = [...gameState.players]
        .filter(p => p.alive && p.opacity > 0.01)
        .sort((a, b) => a.y - b.y);

      for (let i = 0; i < sortedPlayers.length; i++) {
        const p = sortedPlayers[i];
        if (!p.isAI) {
          ctx.save();
          ctx.strokeStyle = '#fb7185';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y + 22, 23, 9.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (p.isAI && gameState.phase === 'fadein') {
          ctx.save();
          ctx.strokeStyle = `rgba(192, 132, 252, ${p.opacity})`;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 32 * (1.3 - p.opacity * 0.3), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        const flashAlpha = (p.invulnTimer > 0 && Math.floor(p.invulnTimer * 18) % 2 === 0) ? 0.45 : p.opacity;

        drawChibiCharacter(ctx, p.x, p.y - 4, 1.28, p.charDef, {
          dir: p.dir,
          walkCycle: p.walkCycle,
          isMoving: p.isMoving,
          armor: p.armor,
          opacity: flashAlpha,
          weapon: p.weapon,
          heldBomb: p.heldBomb,
          actionPoseTimer: p.actionPoseTimer,
          actionPoseType: p.actionPoseType,
          blinking: p.blinkTimer < 0
        });
      }

      // 9. Draw Parabolic Thrown Bombs
      for (let i = 0; i < gameState.thrownBombs.length; i++) {
        const tb = gameState.thrownBombs[i];
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(tb.targetX, tb.targetY, 20 * (1 - tb.progress * 0.4), 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        ctx.ellipse(tb.x, tb.y + 10, 13, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(tb.x, tb.y - tb.z);
        ctx.rotate(tb.progress * Math.PI * 4);
        ctx.fillStyle = tb.isPower ? '#701a75' : '#0f172a';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(8, -14, 4.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 10. Draw 10-Second Sky Drop Parachutes
      for (let i = 0; i < gameState.skyDrops.length; i++) {
        const sd = gameState.skyDrops[i];
        const def = WEAPON_DEFS[sd.type];
        ctx.save();
        ctx.strokeStyle = def ? def.color : '#38bdf8';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(sd.x, sd.y, 20, 0, Math.PI * 2);
        ctx.stroke();

        const swayX = Math.sin(sd.swayPhase) * 8;
        ctx.translate(sd.x + swayX, sd.y - sd.z);

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-19, -25); ctx.lineTo(-6, 0);
        ctx.moveTo(19, -25);  ctx.lineTo(6, 0);
        ctx.stroke();

        ctx.fillStyle = def ? def.color : '#38bdf8';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -25, 21, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 4, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // 11. Draw "Ascend to Heaven" Animations
      for (let i = 0; i < gameState.ascensions.length; i++) {
        drawAscensionEffect(ctx, gameState.ascensions[i]);
      }

      // 12. Draw Debris & Spark Particles
      for (let i = 0; i < gameState.particles.length; i++) {
        const pt = gameState.particles[i];
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        if (pt.isDebris) {
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot || 0);
          ctx.fillRect(-pt.r, -pt.r * 0.6, pt.r * 2, pt.r * 1.2);
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.fillStyle = 'rgba(226, 232, 240, 0.25)';
      for (let i = 0; i < gameState.dustMotes.length; i++) {
        const m = gameState.dustMotes[i];
        ctx.fillRect(m.x, m.y, m.r * 1.5, m.r * 1.5);
      }

      ctx.restore();

      // 13. Sleek Corner Mini-Radar
      if (gameState.phase === 'countdown' || gameState.phase === 'fadein' || gameState.phase === 'battle') {
        drawMiniRadar(ctx, vw, vh);
      }
    }

    function drawMiniRadar(ctx, vw, vh) {
      const scale = vw < 500 ? 3.2 : 4.0;
      const rw = GRID_COLS * scale;
      const rh = GRID_ROWS * scale;
      const rx = 12;
      const ry = 54;

      ctx.save();
      ctx.fillStyle = 'rgba(9, 11, 20, 0.82)';
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(rx - 3, ry - 3, rw + 6, rh + 6, 6);
      ctx.fill();
      ctx.stroke();

      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const t = mapGrid[r][c];
          if (t === 1 || t === 3) {
            ctx.fillStyle = 'rgba(100, 116, 139, 0.55)';
            ctx.fillRect(rx + c * scale, ry + r * scale, scale, scale);
          } else if (t === 2) {
            ctx.fillStyle = 'rgba(217, 119, 6, 0.55)';
            ctx.fillRect(rx + c * scale, ry + r * scale, scale, scale);
          }
        }
      }

      for (let i = 0; i < gameState.items.length; i++) {
        const it = gameState.items[i];
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(rx + it.col * scale, ry + it.row * scale, scale, scale);
      }

      for (let i = 0; i < gameState.players.length; i++) {
        const p = gameState.players[i];
        if (!p.alive || p.opacity < 0.2) continue;
        const px = rx + (p.x / TILE_SIZE) * scale;
        const py = ry + (p.y / TILE_SIZE) * scale;
        ctx.fillStyle = p.isAI ? '#f43f5e' : '#34d399';
        ctx.beginPath();
        ctx.arc(px, py, p.isAI ? 2.4 : 3.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // =========================================================================
    // 15. CHARACTER SELECTION CARDS SETUP & BOOTSTRAP
    // =========================================================================
    function buildCharacterSelectionCards() {
      const grid = document.getElementById('charGrid');
      grid.innerHTML = '';

      CHARACTERS.forEach(c => {
        const card = document.createElement('div');
        card.className = `char-card rounded-2xl p-3 bg-slate-900/90 border-2 flex flex-col items-center text-center ${
          c.id === gameState.selectedCharId ? 'selected' : 'border-slate-700/70'
        }`;

        const cvs = document.createElement('canvas');
        cvs.width = 104;
        cvs.height = 104;
        cvs.className = 'mb-1.5';
        const cctx = cvs.getContext('2d');
        // Render character without armor vest on card preview so the multi-layered coat, shirt, trousers, shoes & fingers are 100% visible!
        drawChibiCharacter(cctx, 52, 58, 1.32, c, {
          dir: { x: 0, y: 1 },
          walkCycle: 0.55,
          isMoving: true,
          armor: 0,
          opacity: 1,
          weapon: null,
          blinking: false
        });

        const nameEl = document.createElement('div');
        nameEl.className = 'font-black text-sm sm:text-base text-white';
        nameEl.textContent = c.name;

        const subEl = document.createElement('div');
        subEl.className = 'text-[11px] text-slate-400 mt-0.5';
        subEl.textContent = c.title;

        card.appendChild(cvs);
        card.appendChild(nameEl);
        card.appendChild(subEl);

        card.addEventListener('click', () => {
          sound.init();
          sound.playPickup();
          gameState.selectedCharId = c.id;
          buildCharacterSelectionCards();
        });

        grid.appendChild(card);
      });
    }

    function mainLoop(timestamp) {
      if (!gameState.lastTime) gameState.lastTime = timestamp;
      const dt = Math.min(0.04, (timestamp - gameState.lastTime) / 1000);
      gameState.lastTime = timestamp;

      updateGame(dt);
      renderScene();
      requestAnimationFrame(mainLoop);
    }

    window.onload = () => {
      prebakeFurnitureSprites();
      buildMap();
      buildCharacterSelectionCards();
      bindControls();
      requestAnimationFrame(mainLoop);
    };
  </script>
</body>
