<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>π Singularity - 終極噴發版</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'PingFang TC', sans-serif; }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }
        #ui-wrapper {
            position: relative; z-index: 10; display: flex; justify-content: center;
            align-items: center; width: 100vw; height: 100vh;
            perspective: 1800px; /* 加強 3D 深度感 */
        }
        .card {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            padding: 45px; border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center; width: 360px; color: #fff;
            transition: all 1.8s cubic-bezier(0.25, 0.1, 0.25, 1); /* 緩慢吸入曲線 */
            transform-style: preserve-3d;
        }
        /* 黑洞吸入方框效果：3D 拉長、扭曲、縮小、消失 */
        .swallowed {
            transform:
                translateZ(-1200px)      /* 向後深墜 */
                scaleX(0.01) scaleY(35)  /* 極端拉長成細長條 */
                rotateX(70deg) rotateY(15deg) rotateZ(720deg) /* 多軸扭曲 + 高速旋轉 */
                translateY(300px);       /* 向下偏移進黑洞 */
            opacity: 0;
            filter: brightness(18) blur(8px) contrast(0.4);
        }
        h2 { color: #d4af37; letter-spacing: 5px; margin-bottom: 10px; }
        .hint { color: #888; font-size: 0.85rem; margin-bottom: 25px; line-height: 1.6; }
        input {
            padding: 12px; width: 220px; border-radius: 8px; border: 1px solid #d4af37;
            background: #000; color: #f1c40f; font-size: 1.8rem; text-align: center;
            margin-bottom: 25px; outline: none;
        }
        button {
            background: linear-gradient(135deg, #f1c40f, #d4af37);
            color: #000; border: none; padding: 12px 45px; border-radius: 50px;
            cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1rem;
        }
        #result-display {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; display: none; text-align: center; width: 100%;
        }
        .ball-container { display: flex; justify-content: center; gap: 15px; perspective: 1500px; }
        .ball {
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #fff, #f1c40f 45%, #8a6d3b);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #000; font-weight: 900; font-size: 2.4rem;
            box-shadow: 0 0 50px rgba(241, 196, 15, 0.9); border: 2px solid #fff;
            animation: star-eject 0.35s cubic-bezier(0.1, 0.9, 0.2, 1) backwards;
        }
        @keyframes star-eject {
            0% { transform: translateZ(-2500px) scale(0); opacity: 0; filter: brightness(15); }
            100% { transform: translateZ(0) scale(1); opacity: 1; filter: brightness(1); }
        }
        #flash { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; opacity:0; z-index:100; pointer-events:none; }
    </style>
</head>
<body>
<div id="flash"></div>
<canvas id="bhCanvas"></canvas>
<div id="ui-wrapper">
    <div class="card" id="mainCard">
        <h2>宇宙奇異點運算器</h2>
        <p class="hint">輸入今天的日期 (YYYYMMDD)<br>預測今日大樂透 6 個幸運號碼</p>
        <input type="text" id="birthdayInput" placeholder="19900101" maxlength="8">
        <br>
        <button onclick="ignite()">生成本日號碼</button>
    </div>
</div>
<div id="result-display">
    <h1 style="color:#fff; text-shadow: 0 0 20px #f1c40f; margin-bottom:35px;">預測本日大樂透號碼</h1>
    <div class="ball-container" id="ballBox"></div>
    <p style="color:#d4af37; margin-top:40px;">本日宇宙奇異點運算值：<span id="finalPos"></span></p>
    <button onclick="location.reload()" style="margin-top:30px; background:none; border:1px solid #444; color:#666; cursor:pointer; padding:8px 20px; border-radius:20px;">重置系統</button>
    </div>
<script>
/** 核心算法 - 完全不動 **/
function seededRandom(seed) {
    let s = BigInt(seed);
    return function() {
        s = (s * 6364136223846793005n + 1n) % 18446744073709551615n;
        return Number(s % 1000000000n) / 1000000000;
    };
}
function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return Math.abs(hash) + 141592;
}
const canvas = document.getElementById('bhCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
let isAbsorbing = false;
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
class Star {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.2;
        this.opacity = Math.random() * 0.8 + 0.2;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
    }
    update() {
        if (isAbsorbing) {
            let dx = canvas.width / 2 - this.x;
            let dy = canvas.height / 2 - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let pull = (300 / (dist + 1)) + 1.5;
            this.x += dx * 0.15 * pull;
            this.y += dy * 0.15 * pull;
            if (dist < 10) this.opacity = 0;
        } else {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
    }
    draw() {
        if (this.opacity <= 0) return;
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}
for(let i=0; i<600; i++) stars.push(new Star());
function animate() {
    ctx.fillStyle = isAbsorbing ? 'rgba(0,0,0,0.7)' : 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!isAbsorbing) {
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, 60, 0, Math.PI*2);
        ctx.fillStyle = '#000';
        ctx.shadowBlur = 30; ctx.shadowColor = '#d4af37';
        ctx.fill(); ctx.shadowBlur = 0;
    }
    stars.forEach(s => { s.update(); s.draw(); });
    requestAnimationFrame(animate);
}
animate();
function ignite() {
    const input = document.getElementById('birthdayInput').value;
    if (input.length !== 8) return alert("輸入錯誤");
    const card = document.getElementById('mainCard');
    const flash = document.getElementById('flash');

    isAbsorbing = true;
    card.classList.add('swallowed');  // 方框被黑洞吸入
    const pos = hashString(input);
    const rng = seededRandom(pos);
    let lucky = [];
    let pool = Array.from({length: 49}, (_, i) => i + 1);
    for (let i = 0; i < 6; i++) {
        let idx = Math.floor(rng() * pool.length);
        lucky.push(pool.splice(idx, 1)[0]);
    }
    lucky.sort((a, b) => a - b);
    setTimeout(() => {
        flash.style.opacity = '1';
        setTimeout(() => {
            flash.style.transition = 'opacity 1s';
            flash.style.opacity = '0';
            isAbsorbing = false;
            showResults(pos, lucky);
        }, 40);
    }, 600);
}
function showResults(pos, lucky) {
    document.getElementById('ui-wrapper').style.display = 'none';
    document.getElementById('finalPos').innerText = pos.toLocaleString();
    const box = document.getElementById('ballBox');
    box.innerHTML = '';
    lucky.forEach((num, i) => {
        const b = document.createElement('div');
        b.className = 'ball';
        b.innerText = num;
        b.style.animationDelay = `${i * 0.1}s`;
        box.appendChild(b);
    });
    document.getElementById('result-display').style.display = 'block';
}
</script>
</body>
</html>
