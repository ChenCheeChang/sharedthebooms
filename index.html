    function createPlayer(charDef, isAI, spawnCol, spawnRow, aiIndex = 0) {
      return {
        id: charDef.id,
        charDef,
        isAI,
        aiIndex,
        x: (spawnCol + 0.5) * TILE_SIZE,
        y: (spawnRow + 0.5) * TILE_SIZE,
        col: spawnCol,
        row: spawnRow,
        dir: { x: 0, y: 1 },
        speed: isAI ? 184 : 198,
        alive: true,
        opacity: isAI ? 0 : 1,
        armor: 1,
        invulnTimer: 0,
        weapon: null,
        weaponCharges: 0,
        heldBomb: null,
        bombCooldown: 0,
        weaponCooldown: 0,
        walkCycle: 0,
        isMoving: false,
        actionPoseTimer: 0, // triggers visible arm throw / flame / place animation!
        actionPoseType: null,
        blinkTimer: Math.random() * 3,
        aiTargetCell: null,
        aiRethinkTimer: isAI ? (aiIndex * 0.06) : 0
      };
    }

    function triggerSkyDrop() {
      const types = ['flame', 'throwglove', 'powerbomb', 'armor'];
      const type = types[Math.floor(Math.random() * types.length)];
      for (let attempt = 0; attempt < 40; attempt++) {
        const c = 1 + Math.floor(Math.random() * (GRID_COLS - 2));
        const r = 1 + Math.floor(Math.random() * (GRID_ROWS - 2));
        if (mapGrid[r][c] === 0 &&
            !gameState.items.some(i => i.col === c && i.row === r) &&
            !gameState.skyDrops.some(sd => sd.col === c && sd.row === r)) {
          gameState.skyDrops.push({
            col: c,
            row: r,
            x: (c + 0.5) * TILE_SIZE,
            y: (r + 0.5) * TILE_SIZE,
            z: 320,
            fallSpeed: 225,
            type,
            swayPhase: Math.random() * Math.PI * 2
          });
          break;
        }
      }
    }

    // =========================================================================
    // 6. INITIALIZE MATCH
    // =========================================================================
    function startMatch() {
      sound.init();
      buildMap();

      const slots = [...SPAWN_SLOTS].sort(() => Math.random() - 0.5);
      gameState.players = [];

      const userChar = CHARACTERS.find(c => c.id === gameState.selectedCharId) || CHARACTERS[0];
      gameState.players.push(createPlayer(userChar, false, slots[0].col, slots[0].row, 0));

      let slotIdx = 1;
      let aiIdx = 0;
      CHARACTERS.forEach(c => {
        if (c.id !== userChar.id) {
          const s = slots[slotIdx++];
          gameState.players.push(createPlayer(c, true, s.col, s.row, aiIdx++));
        }
      });

      gameState.bombs = [];
      gameState.thrownBombs = [];
      gameState.explosions = [];
      gameState.flameStreams = [];
      gameState.items = [];
      gameState.skyDrops = [];
      gameState.detachedArmors = [];
      gameState.ascensions = [];
      gameState.particles = [];
      gameState.airdropTimer = 0;

      gameState.dustMotes = Array.from({ length: 26 }, () => ({
        x: Math.random() * GRID_COLS * TILE_SIZE,
        y: Math.random() * GRID_ROWS * TILE_SIZE,
        r: 1.5 + Math.random() * 1.8,
        vx: (Math.random() - 0.5) * 14,
        vy: -7 - Math.random() * 10,
        alpha: 0.18 + Math.random() * 0.3
      }));

      gameState.phase = 'countdown';
      gameState.countdownTimer = 10.0;
      gameState.fadeTimer = 0;

      document.getElementById('selectScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('flex');
      document.getElementById('topHud').classList.remove('hidden');
      document.getElementById('bottomControls').classList.remove('hidden');
      document.getElementById('countdownBadge').classList.remove('hidden');
      document.getElementById('countdownNum').textContent = '10';

      updateTopStatusStrip();
      updateWeaponButtonUI();
      sound.startBGM();
    }

    // =========================================================================
    // 7. FURNITURE DESTRUCTION & LOOT DROP LOGIC
    // =========================================================================
    function destroyFurnitureAt(col, row) {
      if (mapGrid[row][col] !== 2) return;
      const key = `${col},${row}`;
      const fData = furnitureMap[key];
      mapGrid[row][col] = 0;
      delete furnitureMap[key];

      const cx = (col + 0.5) * TILE_SIZE;
      const cy = (row + 0.5) * TILE_SIZE;

      stampScorchMarkOnStaticMap(cx, cy, TILE_SIZE * 0.44);

      const debrisColors = ['#92400e', '#b45309', '#cbd5e1', '#fbbf24', '#78350f'];
      for (let i = 0; i < 12; i++) {
        const ang = (Math.PI * 2 * i) / 12 + (Math.random() - 0.5) * 0.3;
        const spd = 70 + Math.random() * 130;
        gameState.particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 20,
          r: 4 + Math.random() * 4,
          color: debrisColors[i % debrisColors.length],
          life: 0.44,
          maxLife: 0.44,
          isDebris: true,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 12
        });
      }

      sound.playFurnitureSmash();

      if (fData && fData.hiddenItem) {
        if (!gameState.items.some(it => it.col === col && it.row === row)) {
          gameState.items.push({
            col,
            row,
            type: fData.hiddenItem,
            bobPhase: Math.random() * Math.PI * 2,
            spawnScale: 0.15
          });
        }
      }
    }

    // =========================================================================
    // 8. COMBAT MECHANICS & ACTION POSES
    // =========================================================================
    function computeThrowLandingTile(startCol, startRow, dirX, dirY, preferredDist = 4) {
      for (let d = preferredDist; d >= 1; d--) {
        const tc = Math.max(1, Math.min(GRID_COLS - 2, startCol + dirX * d));
        const tr = Math.max(1, Math.min(GRID_ROWS - 2, startRow + dirY * d));
        if (mapGrid[tr][tc] === 0 && !gameState.bombs.some(b => b.col === tc && b.row === tr)) {
          return { col: tc, row: tr };
        }
      }
      return { col: startCol, row: startRow };
    }

    function launchThrownBomb(player, bombData, targetCol, targetRow) {
      sound.playThrowBomb();
      player.actionPoseTimer = 0.35;
      player.actionPoseType = 'throw';
      gameState.thrownBombs.push({
        startX: player.x,
        startY: player.y,
        x: player.x,
        y: player.y,
        z: 30,
        targetCol,
        targetRow,
        targetX: (targetCol + 0.5) * TILE_SIZE,
        targetY: (targetRow + 0.5) * TILE_SIZE,
        progress: 0,
        flightDuration: 0.38,
        ownerId: bombData.ownerId,
        ownerIsAI: bombData.ownerIsAI,
        radius: bombData.radius,
        isPower: bombData.isPower,
        remainingFuse: Math.max(1.05, bombData.timer)
      });
    }

    function placeBomb(player) {
      if (!player.alive) return;
      if (gameState.phase !== 'battle' && player.isAI) return;

      if (player.heldBomb) {
        const dx = Math.round(player.dir.x);
        const dy = Math.round(player.dir.y);
        const dirX = (dx === 0 && dy === 0) ? 0 : dx;
        const dirY = (dx === 0 && dy === 0) ? 1 : dy;
        const land = computeThrowLandingTile(player.col, player.row, dirX, dirY, 4);
        launchThrownBomb(player, player.heldBomb, land.col, land.row);
        player.heldBomb = null;
        player.bombCooldown = 0.15;
        return;
      }

      const existingBombAtFeet = gameState.bombs.find(b => b.col === player.col && b.row === player.row);
      if (existingBombAtFeet && player.weapon === 'throwglove' && player.weaponCharges > 0) {
        gameState.bombs = gameState.bombs.filter(b => b !== existingBombAtFeet);
        player.heldBomb = existingBombAtFeet;
        player.weaponCharges--;
        if (player.weaponCharges <= 0) player.weapon = null;
        if (!player.isAI) updateWeaponButtonUI();
        sound.playPickup();
        return;
      }

      if (player.bombCooldown > 0) return;
      if (existingBombAtFeet) return;

      const activeCount = gameState.bombs.filter(b => b.ownerId === player.id).length;
      if (activeCount >= 3) return;

      let radius = 2;
      let isPower = false;

      if (player.weapon === 'powerbomb' && player.weaponCharges > 0) {
        radius = 4;
        isPower = true;
        player.weaponCharges--;
        if (player.weaponCharges <= 0) {
          player.weapon = null;
        }
        if (!player.isAI) updateWeaponButtonUI();
      }

      player.actionPoseTimer = 0.25;
      player.actionPoseType = 'place';

      gameState.bombs.push({
        col: player.col,
        row: player.row,
        x: (player.col + 0.5) * TILE_SIZE,
        y: (player.row + 0.5) * TILE_SIZE,
        ownerId: player.id,
        ownerIsAI: player.isAI,
        radius,
        isPower,
        timer: 2.25,
        maxTimer: 2.25,
        passThroughIds: gameState.players
          .filter(p => p.alive && Math.hypot(p.x - (player.col + 0.5) * TILE_SIZE, p.y - (player.row + 0.5) * TILE_SIZE) < TILE_SIZE * 0.9)
          .map(p => p.id)
      });

      player.bombCooldown = 0.15;
      sound.playPlaceBomb();
    }

    function useEquippedWeapon(player) {
      if (!player.alive || player.weaponCooldown > 0) return;

      const dx = Math.round(player.dir.x);
      const dy = Math.round(player.dir.y);
      const dirX = (dx === 0 && dy === 0) ? 0 : dx;
      const dirY = (dx === 0 && dy === 0) ? 1 : dy;

      if (player.heldBomb) {
        const land = computeThrowLandingTile(player.col, player.row, dirX, dirY, 4);
        launchThrownBomb(player, player.heldBomb, land.col, land.row);
        player.heldBomb = null;
        player.weaponCooldown = 0.20;
        return;
      }

      if (!player.weapon || player.weaponCharges <= 0) return;
      if (gameState.phase !== 'battle' && player.isAI) return;

      if (player.weapon === 'powerbomb') {
        placeBomb(player);
        return;
      }

      if (player.weapon === 'throwglove') {
        const bombToGrab = gameState.bombs.find(
          b => (b.col === player.col && b.row === player.row) ||
               (b.col === player.col + dirX && b.row === player.row + dirY)
        );

        let bombPayload;
        if (bombToGrab) {
          gameState.bombs = gameState.bombs.filter(b => b !== bombToGrab);
          bombPayload = bombToGrab;
        } else {
          bombPayload = {
            ownerId: player.id,
            ownerIsAI: player.isAI,
            radius: 2,
            isPower: false,
            timer: 1.5
          };
        }

        const land = computeThrowLandingTile(player.col, player.row, dirX, dirY, 4);
        launchThrownBomb(player, bombPayload, land.col, land.row);

        player.weaponCharges--;
        player.weaponCooldown = 0.26;
      } else if (player.weapon === 'flame') {
        player.actionPoseTimer = 0.42;
        player.actionPoseType = 'flame';

        const cells = [];
        for (let step = 1; step <= 5; step++) {
          const nc = player.col + dirX * step;
          const nr = player.row + dirY * step;
          if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) break;
          const tile = mapGrid[nr][nc];
          if (tile === 1 || tile === 3) break;
          if (tile === 2) {
            cells.push({ col: nc, row: nr });
            destroyFurnitureAt(nc, nr);
            break;
          }
          cells.push({ col: nc, row: nr });
        }

        gameState.flameStreams.push({
          ownerId: player.id,
          ownerIsAI: player.isAI,
          cells,
          dirX,
          dirY,
          timer: 0.42,
          maxTimer: 0.42
        });

        cells.forEach(cell => {
          gameState.bombs.forEach(b => {
            if (b.col === cell.col && b.row === cell.row && b.timer > 0.05) {
              b.timer = 0.05;
            }
          });
        });

        sound.playFlamethrower();
        player.weaponCharges--;
        player.weaponCooldown = 0.28;
      }

      if (player.weaponCharges <= 0) {
        player.weapon = null;
        player.weaponCharges = 0;
      }
      if (!player.isAI) updateWeaponButtonUI();
    }

    function detonateBomb(bomb) {
      sound.playCuteBombExplosion(bomb.isPower);

      stampScorchMarkOnStaticMap(
        (bomb.col + 0.5) * TILE_SIZE,
        (bomb.row + 0.5) * TILE_SIZE,
        TILE_SIZE * 0.48
      );

      const affectedCells = [{ col: bomb.col, row: bomb.row, isCenter: true, dir: 'center' }];
      const dirs = [
        { dx: 0, dy: -1, name: 'up' },
        { dx: 0, dy: 1,  name: 'down' },
        { dx: -1, dy: 0, name: 'left' },
        { dx: 1, dy: 0,  name: 'right' }
      ];

      dirs.forEach(d => {
        for (let step = 1; step <= bomb.radius; step++) {
          const nc = bomb.col + d.dx * step;
          const nr = bomb.row + d.dy * step;
          if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) break;

          const tile = mapGrid[nr][nc];
          if (tile === 1 || tile === 3) break;

          if (tile === 2) {
            affectedCells.push({
              col: nc,
              row: nr,
              isCenter: false,
              isEnd: true,
              dir: d.name
            });
            destroyFurnitureAt(nc, nr);
            break;
          }

          affectedCells.push({
            col: nc,
            row: nr,
            isCenter: false,
            isEnd: step === bomb.radius,
            dir: d.name
          });
        }
      });

      gameState.explosions.push({
        ownerId: bomb.ownerId,
        ownerIsAI: bomb.ownerIsAI,
        cells: affectedCells,
        isPower: bomb.isPower,
        timer: 0.46,
        maxTimer: 0.46
      });

      affectedCells.forEach(c => {
        const cx = (c.col + 0.5) * TILE_SIZE;
        const cy = (c.row + 0.5) * TILE_SIZE;
        for (let i = 0; i < 2; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 45 + Math.random() * 90;
          gameState.particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 4 + Math.random() * 4,
            color: bomb.isPower ? '#e879f9' : '#fb923c',
            life: 0.32,
            maxLife: 0.32
          });
        }
      });

      gameState.bombs.forEach(other => {
        if (other !== bomb && other.timer > 0.05) {
          if (affectedCells.some(c => c.col === other.col && c.row === other.row)) {
            other.timer = 0.05;
          }
        }
      });
    }

    function applyHitToPlayer(player, attackerOwnerId = null) {
      if (!player.alive || player.invulnTimer > 0 || gameState.phase !== 'battle') return;

      if (player.isAI && attackerOwnerId === player.id) {
        return;
      }

      if (player.armor > 0) {
        player.armor--;
        player.invulnTimer = 1.25;
        sound.playArmorDetach();

        const flyAngle = Math.atan2(-player.dir.y, -player.dir.x) + (Math.random() - 0.5) * 0.8;
        gameState.detachedArmors.push({
          x: player.x,
          y: player.y - 6,
          z: 10,
          vx: Math.cos(flyAngle) * 125,
          vy: Math.sin(flyAngle) * 100 - 30,
          vz: 195,
          rot: 0,
          vRot: (Math.random() > 0.5 ? 1 : -1) * 11,
          life: 1.75,
          maxLife: 1.75,
          splitProgress: 0
        });

        for (let i = 0; i < 10; i++) {
          const ang = (Math.PI * 2 * i) / 10;
          const spd = 65 + Math.random() * 85;
          gameState.particles.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 3.5,
            color: i % 2 === 0 ? '#38bdf8' : '#facc15',
            life: 0.4,
            maxLife: 0.4
          });
        }
        updateTopStatusStrip();
      } else {
        player.alive = false;
        player.heldBomb = null;
        sound.playAscendHeaven();

        gameState.ascensions.push({
          x: player.x,
          y: player.y,
          startY: player.y,
          charDef: player.charDef,
          timer: 0,
          duration: 2.5
        });

        updateTopStatusStrip();
        checkMatchEnd();
      }
    }

    function checkMatchEnd() {
      if (gameState.phase === 'gameover') return;
      const alivePlayers = gameState.players.filter(p => p.alive);
      const userPlayer = gameState.players.find(p => !p.isAI);

      if (!userPlayer.alive || alivePlayers.length <= 1) {
        setTimeout(() => {
          if (gameState.phase === 'gameover') return;
          const stillAlive = gameState.players.filter(p => p.alive);
          const winner = stillAlive[0] || userPlayer;
          showGameOverModal(winner, userPlayer.alive && stillAlive.length === 1);
        }, 1600);
      }
    }

    function showGameOverModal(winner, isUserVictory) {
      gameState.phase = 'gameover';
      sound.stopBGM();

      const modal = document.getElementById('resultScreen');
      const title = document.getElementById('resultTitle');
      const subtitle = document.getElementById('resultSubtitle');
      const avatarCanvas = document.getElementById('resultAvatarCanvas');
      const ctx = avatarCanvas.getContext('2d');

      ctx.clearRect(0, 0, 128, 128);
      drawChibiCharacter(ctx, 64, 74, 1.38, winner.charDef, {
        dir: { x: 0, y: 1 },
        walkCycle: 0,
        isMoving: false,
        armor: 1,
        opacity: 1,
        weapon: null,
        blinking: false
      });

      if (isUserVictory) {
        title.textContent = '🏆 最後生還・完美勝出！';
        title.className = 'text-2xl sm:text-3xl font-black text-amber-300 mb-1';
        subtitle.textContent = `${winner.charDef.name} 成功擊退所有獵手，獨霸暗夜莊園！`;
      } else {
        title.textContent = '👼 靈魂升天・對決結束';
        title.className = 'text-2xl sm:text-3xl font-black text-rose-300 mb-1';
        subtitle.textContent = `本局最後存活者：${winner.charDef.name}`;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // =========================================================================
    // 9. ZERO-GC ULTRA-FAST AI PATHFINDING
    // =========================================================================
    const TOTAL_CELLS = GRID_ROWS * GRID_COLS;
    const dangerBuffer = new Uint8Array(TOTAL_CELLS);
    const simDangerBuffer = new Uint8Array(TOTAL_CELLS);
    const visitedBuffer = new Uint8Array(TOTAL_CELLS);
    const bfsColQ = new Int16Array(TOTAL_CELLS);
    const bfsRowQ = new Int16Array(TOTAL_CELLS);
    const bfsDistQ = new Int16Array(TOTAL_CELLS);
    const bfsFirstColQ = new Int16Array(TOTAL_CELLS);
    const bfsFirstRowQ = new Int16Array(TOTAL_CELLS);
    const bfsBreachQ = new Uint8Array(TOTAL_CELLS);

    const DIRS_4 = [
      { dx: 0, dy: -1 },
      { dx: 0, dy: 1 },
      { dx: -1, dy: 0 },
      { dx: 1, dy: 0 }
    ];

    function projectBombDangerFlat(buf, col, row, radius) {
      buf[row * GRID_COLS + col] = 1;
      for (let i = 0; i < 4; i++) {
        const d = DIRS_4[i];
        for (let s = 1; s <= radius; s++) {
          const nc = col + d.dx * s;
          const nr = row + d.dy * s;
          if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) break;
          const tile = mapGrid[nr][nc];
          if (tile === 1 || tile === 3) break;
          buf[nr * GRID_COLS + nc] = 1;
          if (tile === 2) break;
        }
      }
    }

    function updateDangerBuffer() {
      dangerBuffer.fill(0);
      for (let i = 0; i < gameState.bombs.length; i++) {
        const b = gameState.bombs[i];
        projectBombDangerFlat(dangerBuffer, b.col, b.row, b.radius);
      }
      for (let i = 0; i < gameState.thrownBombs.length; i++) {
        const tb = gameState.thrownBombs[i];
        projectBombDangerFlat(dangerBuffer, tb.targetCol, tb.targetRow, tb.radius);
      }
      for (let i = 0; i < gameState.explosions.length; i++) {
        const cells = gameState.explosions[i].cells;
        for (let j = 0; j < cells.length; j++) {
          dangerBuffer[cells[j].row * GRID_COLS + cells[j].col] = 1;
        }
      }
      for (let i = 0; i < gameState.flameStreams.length; i++) {
        const cells = gameState.flameStreams[i].cells;
        for (let j = 0; j < cells.length; j++) {
          dangerBuffer[cells[j].row * GRID_COLS + cells[j].col] = 1;
        }
      }
    }

    function findSafeEscapeStepFast(startCol, startRow, dBuf) {
      visitedBuffer.fill(0);
      let head = 0;
      let tail = 0;

      bfsColQ[tail] = startCol;
      bfsRowQ[tail] = startRow;
      bfsDistQ[tail] = 0;
      bfsFirstColQ[tail] = -1;
      bfsFirstRowQ[tail] = -1;
      tail++;
      visitedBuffer[startRow * GRID_COLS + startCol] = 1;

      while (head < tail) {
        const c = bfsColQ[head];
        const r = bfsRowQ[head];
        const dist = bfsDistQ[head];
        const fc = bfsFirstColQ[head];
        const fr = bfsFirstRowQ[head];
        head++;

        if (dist > 0 && dBuf[r * GRID_COLS + c] === 0) {
          return { col: fc, row: fr };
        }
        if (dist >= 8) continue;

        for (let i = 0; i < 4; i++) {
          const nc = c + DIRS_4[i].dx;
          const nr = r + DIRS_4[i].dy;
          if (nc <= 0 || nc >= GRID_COLS - 1 || nr <= 0 || nr >= GRID_ROWS - 1) continue;
          const idx = nr * GRID_COLS + nc;
          if (visitedBuffer[idx] || mapGrid[nr][nc] !== 0) continue;
          let hasBomb = false;
          for (let b = 0; b < gameState.bombs.length; b++) {
            if (gameState.bombs[b].col === nc && gameState.bombs[b].row === nr) { hasBomb = true; break; }
          }
          if (hasBomb) continue;

          visitedBuffer[idx] = 1;
          bfsColQ[tail] = nc;
          bfsRowQ[tail] = nr;
          bfsDistQ[tail] = dist + 1;
          bfsFirstColQ[tail] = dist === 0 ? nc : fc;
          bfsFirstRowQ[tail] = dist === 0 ? nr : fr;
          tail++;
        }
      }
      return null;
    }

    function getSafeEscapeAfterBombingFast(ai) {
      simDangerBuffer.set(dangerBuffer);
      const radius = ai.weapon === 'powerbomb' ? 4 : 2;
      projectBombDangerFlat(simDangerBuffer, ai.col, ai.row, radius);

      visitedBuffer.fill(0);
      let head = 0;
      let tail = 0;

      bfsColQ[tail] = ai.col;
      bfsRowQ[tail] = ai.row;
      bfsDistQ[tail] = 0;
      bfsFirstColQ[tail] = -1;
      bfsFirstRowQ[tail] = -1;
      tail++;
      visitedBuffer[ai.row * GRID_COLS + ai.col] = 1;

      while (head < tail) {
        const c = bfsColQ[head];
        const r = bfsRowQ[head];
        const dist = bfsDistQ[head];
        const fc = bfsFirstColQ[head];
        const fr = bfsFirstRowQ[head];
        head++;

        if (dist > 0 && simDangerBuffer[r * GRID_COLS + c] === 0) {
          return { col: fc, row: fr };
        }
        if (dist >= 5) continue;

        for (let i = 0; i < 4; i++) {
          const nc = c + DIRS_4[i].dx;
          const nr = r + DIRS_4[i].dy;
          if (nc <= 0 || nc >= GRID_COLS - 1 || nr <= 0 || nr >= GRID_ROWS - 1) continue;
          const idx = nr * GRID_COLS + nc;
          if (visitedBuffer[idx] || mapGrid[nr][nc] !== 0 || dangerBuffer[idx]) continue;
          let hasBomb = false;
          for (let b = 0; b < gameState.bombs.length; b++) {
            if (gameState.bombs[b].col === nc && gameState.bombs[b].row === nr) { hasBomb = true; break; }
          }
          if (hasBomb) continue;

          visitedBuffer[idx] = 1;
          bfsColQ[tail] = nc;
          bfsRowQ[tail] = nr;
          bfsDistQ[tail] = dist + 1;
          bfsFirstColQ[tail] = dist === 0 ? nc : fc;
          bfsFirstRowQ[tail] = dist === 0 ? nr : fr;
          tail++;
        }
      }
      return null;
    }

    function findHuntStepTowardsFast(startCol, startRow, goalCol, goalRow, allowFurnitureBreach) {
      if (startCol === goalCol && startRow === goalRow) return null;
      visitedBuffer.fill(0);
      let head = 0;
      let tail = 0;

      bfsColQ[tail] = startCol;
      bfsRowQ[tail] = startRow;
      bfsDistQ[tail] = 0;
      bfsFirstColQ[tail] = -1;
      bfsFirstRowQ[tail] = -1;
      bfsBreachQ[tail] = 0;
      tail++;
      visitedBuffer[startRow * GRID_COLS + startCol] = 1;

      while (head < tail) {
        const c = bfsColQ[head];
        const r = bfsRowQ[head];
        const dist = bfsDistQ[head];
        const fc = bfsFirstColQ[head];
        const fr = bfsFirstRowQ[head];
        const breach = bfsBreachQ[head];
        head++;

        if (c === goalCol && r === goalRow) {
          return {
            step: fc >= 0 ? { col: fc, row: fr } : null,
            breachFurniture: breach === 1,
            dist
          };
        }
        if (dist >= 26) continue;

        for (let i = 0; i < 4; i++) {
          const nc = c + DIRS_4[i].dx;
          const nr = r + DIRS_4[i].dy;
          if (nc <= 0 || nc >= GRID_COLS - 1 || nr <= 0 || nr >= GRID_ROWS - 1) continue;
          const idx = nr * GRID_COLS + nc;
          if (visitedBuffer[idx] || dangerBuffer[idx]) continue;
          const tile = mapGrid[nr][nc];
          if (tile === 1 || tile === 3) continue;
          if (tile === 2 && !allowFurnitureBreach) continue;
          let hasBomb = false;
          for (let b = 0; b < gameState.bombs.length; b++) {
            if (gameState.bombs[b].col === nc && gameState.bombs[b].row === nr) { hasBomb = true; break; }
          }
          if (hasBomb) continue;

          visitedBuffer[idx] = 1;
          if (tile === 2) {
            if (dist === 0) {
              return { step: { col: startCol, row: startRow }, breachFurniture: true, dist: 1 };
            }
            bfsColQ[tail] = nc;
            bfsRowQ[tail] = nr;
            bfsDistQ[tail] = dist + 1;
            bfsFirstColQ[tail] = fc;
            bfsFirstRowQ[tail] = fr;
            bfsBreachQ[tail] = 1;
            tail++;
          } else {
            bfsColQ[tail] = nc;
            bfsRowQ[tail] = nr;
            bfsDistQ[tail] = dist + 1;
            bfsFirstColQ[tail] = dist === 0 ? nc : fc;
            bfsFirstRowQ[tail] = dist === 0 ? nr : fr;
            bfsBreachQ[tail] = breach;
            tail++;
          }
        }
      }
      return null;
    }

    function hasClearLineOfSight(c1, r1, c2, r2, maxDist) {
      if (c1 !== c2 && r1 !== r2) return false;
      const dist = Math.abs(c1 - c2) + Math.abs(r1 - r2);
      if (dist === 0 || dist > maxDist) return false;
      const dx = Math.sign(c2 - c1);
      const dy = Math.sign(r2 - r1);
      for (let s = 1; s < dist; s++) {
        if (mapGrid[r1 + dy * s][c1 + dx * s] !== 0) return false;
      }
      return true;
    }

    function isAdjacentToDestructibleFurniture(col, row) {
      for (let i = 0; i < 4; i++) {
        const nc = col + DIRS_4[i].dx;
        const nr = row + DIRS_4[i].dy;
        if (nc > 0 && nc < GRID_COLS - 1 && nr > 0 && nr < GRID_ROWS - 1 && mapGrid[nr][nc] === 2) {
          return true;
        }
      }
      return false;
    }

    function updateAI(ai, dt) {
      if (!ai.alive || gameState.phase !== 'battle') return;

      ai.aiRethinkTimer -= dt;
      const inDanger = dangerBuffer[ai.row * GRID_COLS + ai.col] === 1;

      if (inDanger) {
        const escapeStep = findSafeEscapeStepFast(ai.col, ai.row, dangerBuffer);
        if (escapeStep) {
          ai.aiTargetCell = escapeStep;
        }
      } else if (
        ai.aiRethinkTimer <= 0 ||
        !ai.aiTargetCell ||
        dangerBuffer[ai.aiTargetCell.row * GRID_COLS + ai.aiTargetCell.col] === 1 ||
        (ai.col === ai.aiTargetCell.col && ai.row === ai.aiTargetCell.row &&
          Math.hypot(ai.x - (ai.col + 0.5) * TILE_SIZE, ai.y - (ai.row + 0.5) * TILE_SIZE) < 6)
      ) {
        ai.aiRethinkTimer = 0.15 + ai.aiIndex * 0.04;

        const userPlayer = gameState.players.find(p => !p.isAI && p.alive);
        const targetEnemy = userPlayer || gameState.players.find(p => p.alive && p.id !== ai.id);

        let nearbyItem = null;
        let bestItemDist = 5;
        for (let i = 0; i < gameState.items.length; i++) {
          const item = gameState.items[i];
          if (dangerBuffer[item.row * GRID_COLS + item.col] === 0) {
            const d = Math.abs(item.col - ai.col) + Math.abs(item.row - ai.row);
            if (d < bestItemDist) {
              bestItemDist = d;
              nearbyItem = item;
            }
          }
        }

        if (targetEnemy) {
          const distToTarget = Math.abs(targetEnemy.col - ai.col) + Math.abs(targetEnemy.row - ai.row);

          if (ai.weapon === 'flame' && ai.weaponCooldown <= 0) {
            if (hasClearLineOfSight(ai.col, ai.row, targetEnemy.col, targetEnemy.row, 5)) {
              ai.dir = {
                x: Math.sign(targetEnemy.col - ai.col),
                y: Math.sign(targetEnemy.row - ai.row)
              };
              useEquippedWeapon(ai);
              return;
            }
          } else if (ai.weapon === 'throwglove' && ai.weaponCooldown <= 0) {
            if ((ai.col === targetEnemy.col || ai.row === targetEnemy.row) && distToTarget >= 3 && distToTarget <= 5) {
              ai.dir = {
                x: Math.sign(targetEnemy.col - ai.col),
                y: Math.sign(targetEnemy.row - ai.row)
              };
              useEquippedWeapon(ai);
              return;
            }
          }

          const effectiveRadius = ai.weapon === 'powerbomb' ? 4 : 2;
          const alignedInCross =
            (ai.col === targetEnemy.col && Math.abs(ai.row - targetEnemy.row) <= effectiveRadius) ||
            (ai.row === targetEnemy.row && Math.abs(ai.col - targetEnemy.col) <= effectiveRadius);

          if ((distToTarget <= 2 || alignedInCross) && ai.bombCooldown <= 0) {
            const escapeStep = getSafeEscapeAfterBombingFast(ai);
            if (escapeStep) {
              placeBomb(ai);
              ai.aiTargetCell = escapeStep;
              return;
            }
          }

          if (nearbyItem) {
            const itemRoute = findHuntStepTowardsFast(ai.col, ai.row, nearbyItem.col, nearbyItem.row, false);
            if (itemRoute && itemRoute.step) {
              ai.aiTargetCell = itemRoute.step;
              return;
            }
          }

          let route = findHuntStepTowardsFast(ai.col, ai.row, targetEnemy.col, targetEnemy.row, false);
          if (!route) {
            route = findHuntStepTowardsFast(ai.col, ai.row, targetEnemy.col, targetEnemy.row, true);
          }

          if (route) {
            if (route.breachFurniture && isAdjacentToDestructibleFurniture(ai.col, ai.row) && ai.bombCooldown <= 0) {
              const escapeStep = getSafeEscapeAfterBombingFast(ai);
              if (escapeStep) {
                placeBomb(ai);
                ai.aiTargetCell = escapeStep;
                return;
              }
            }
            if (route.step && dangerBuffer[route.step.row * GRID_COLS + route.step.col] === 0) {
              ai.aiTargetCell = route.step;
              return;
            }
          }

          if (isAdjacentToDestructibleFurniture(ai.col, ai.row) && ai.bombCooldown <= 0 &&
              !gameState.bombs.some(b => b.ownerId === ai.id)) {
            const escapeStep = getSafeEscapeAfterBombingFast(ai);
            if (escapeStep) {
              placeBomb(ai);
              ai.aiTargetCell = escapeStep;
              return;
            }
          }
        }
      }

      if (ai.aiTargetCell) {
        if (!inDanger && dangerBuffer[ai.aiTargetCell.row * GRID_COLS + ai.aiTargetCell.col] === 1) {
          ai.aiTargetCell = null;
          ai.isMoving = false;
          return;
        }

        const tx = (ai.aiTargetCell.col + 0.5) * TILE_SIZE;
        const ty = (ai.aiTargetCell.row + 0.5) * TILE_SIZE;
        const dx = tx - ai.x;
        const dy = ty - ai.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 1.5) {
          const stepDist = Math.min(dist, ai.speed * dt);
          const stepX = (dx / dist) * stepDist;
          const stepY = (dy / dist) * stepDist;
          moveEntityWithCollision(ai, stepX, stepY);
          ai.dir = {
            x: Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0,
            y: Math.abs(dy) >= Math.abs(dx) ? Math.sign(dy) : 0
          };
          ai.isMoving = true;
          ai.walkCycle += dt * 12;
        } else {
          ai.x = tx;
          ai.y = ty;
          ai.col = ai.aiTargetCell.col;
          ai.row = ai.aiTargetCell.row;
          ai.isMoving = false;
        }
      }
    }

    // =========================================================================
    // 10. BUTTER-SMOOTH AUTO-CORNER-SLIDING MOVEMENT PHYSICS (零卡牆自動導角)
    //     When pressing a direction near a doorway or pillar corner, the player
    //     automatically glides into the open lane at full speed!
    // =========================================================================
    function isTileBlockedForPlayer(player, col, row) {
      if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return true;
      if (mapGrid[row][col] !== 0) return true;
      for (let i = 0; i < gameState.bombs.length; i++) {
        const b = gameState.bombs[i];
        if (b.col === col && b.row === row && !b.passThroughIds.includes(player.id)) {
          return true;
        }
      }
      return false;
    }

    function moveEntityWithCollision(player, dx, dy) {
      const radius = TILE_SIZE * 0.27;

      // Horizontal Movement + Auto-Corner Alignment
      if (dx !== 0) {
        const nextX = player.x + dx;
        const checkCol = Math.floor((nextX + Math.sign(dx) * radius) / TILE_SIZE);
        const topRow = Math.floor((player.y - radius * 0.78) / TILE_SIZE);
        const botRow = Math.floor((player.y + radius * 0.78) / TILE_SIZE);

        const topBlocked = isTileBlockedForPlayer(player, checkCol, topRow);
        const botBlocked = isTileBlockedForPlayer(player, checkCol, botRow);

        if (!topBlocked && !botBlocked) {
          player.x = nextX;
        } else {
          // Snap X flush to tile edge
          if (dx > 0) {
            player.x = Math.min(player.x, checkCol * TILE_SIZE - radius - 0.1);
          } else {
            player.x = Math.max(player.x, (checkCol + 1) * TILE_SIZE + radius + 0.1);
          }
          // Auto-slide vertically into open adjacent lane!
          let openRow = -1;
          const centerRow = Math.floor(player.y / TILE_SIZE);
          if (!isTileBlockedForPlayer(player, checkCol, centerRow)) {
            openRow = centerRow;
          } else if (!topBlocked) {
            openRow = topRow;
          } else if (!botBlocked) {
            openRow = botRow;
          }
          if (openRow !== -1 && dy === 0) {
            const targetY = (openRow + 0.5) * TILE_SIZE;
            const diffY = targetY - player.y;
            if (Math.abs(diffY) > 0.5) {
              player.y += Math.sign(diffY) * Math.min(Math.abs(diffY), Math.abs(dx) * 1.05);
            }
          }
        }
      }

      // Vertical Movement + Auto-Corner Alignment
      if (dy !== 0) {
        const nextY = player.y + dy;
        const checkRow = Math.floor((nextY + Math.sign(dy) * radius) / TILE_SIZE);
        const leftCol = Math.floor((player.x - radius * 0.78) / TILE_SIZE);
        const rightCol = Math.floor((player.x + radius * 0.78) / TILE_SIZE);

        const leftBlocked = isTileBlockedForPlayer(player, leftCol, checkRow);
        const rightBlocked = isTileBlockedForPlayer(player, rightCol, checkRow);

        if (!leftBlocked && !rightBlocked) {
          player.y = nextY;
        } else {
          if (dy > 0) {
            player.y = Math.min(player.y, checkRow * TILE_SIZE - radius - 0.1);
          } else {
            player.y = Math.max(player.y, (checkRow + 1) * TILE_SIZE + radius + 0.1);
          }
          // Auto-slide horizontally into open adjacent lane!
          let openCol = -1;
          const centerCol = Math.floor(player.x / TILE_SIZE);
          if (!isTileBlockedForPlayer(player, centerCol, checkRow)) {
            openCol = centerCol;
          } else if (!leftBlocked) {
            openCol = leftCol;
          } else if (!rightBlocked) {
            openCol = rightCol;
          }
          if (openCol !== -1 && dx === 0) {
            const targetX = (openCol + 0.5) * TILE_SIZE;
            const diffX = targetX - player.x;
            if (Math.abs(diffX) > 0.5) {
              player.x += Math.sign(diffX) * Math.min(Math.abs(diffX), Math.abs(dy) * 1.05);
            }
          }
        }
      }

      player.col = Math.floor(player.x / TILE_SIZE);
      player.row = Math.floor(player.y / TILE_SIZE);

      for (let i = 0; i < gameState.bombs.length; i++) {
        const b = gameState.bombs[i];
        if (b.passThroughIds.includes(player.id)) {
          const dist = Math.hypot(player.x - b.x, player.y - b.y);
          if (dist > TILE_SIZE * 0.88) {
            b.passThroughIds = b.passThroughIds.filter(id => id !== player.id);
          }
        }
      }

      for (let i = gameState.items.length - 1; i >= 0; i--) {
        const item = gameState.items[i];
        if (item.col === player.col && item.row === player.row) {
          if (item.type === 'armor') {
            player.armor += 1;
            updateTopStatusStrip();
          } else {
            player.weapon = item.type;
            player.weaponCharges = WEAPON_DEFS[item.type].charges;
            if (!player.isAI) updateWeaponButtonUI();
          }
          if (!player.isAI) sound.playPickup();
          gameState.items.splice(i, 1);
        }
      }
    }

    // =========================================================================
    // 11. BULLETPROOF DIRECTIONAL CONTROLS (Direct Button Hit + Multi-Touch + Thumb Slide)
    //     Fixes all directional control bugs:
    //     1. Pressing Up, Down, Left, Right directly ALWAYS triggers that exact button.
    //     2. Sliding thumb anywhere across the D-Pad smoothly switches directions.
    //     3. Multi-touch safe: pressing Bomb/Weapon with right hand NEVER cancels left D-pad!
    // =========================================================================
    const inputState = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    const keyState = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    function bindControls() {
      const dpad = document.getElementById('dpadContainer');
      const btnUp = document.getElementById('btnUp');
      const btnDown = document.getElementById('btnDown');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const dirBtns = { up: btnUp, down: btnDown, left: btnLeft, right: btnRight };

      let dpadPointerId = null;

      const setActiveDirection = (dir) => {
        inputState.up = dir === 'up';
        inputState.down = dir === 'down';
        inputState.left = dir === 'left';
        inputState.right = dir === 'right';
        btnUp.classList.toggle('active-press', dir === 'up');
        btnDown.classList.toggle('active-press', dir === 'down');
        btnLeft.classList.toggle('active-press', dir === 'left');
        btnRight.classList.toggle('active-press', dir === 'right');
      };

      const resolveDirectionFromPoint = (clientX, clientY) => {
        // First check if point is directly inside one of the 4 circular buttons
        const el = document.elementFromPoint(clientX, clientY);
        if (el) {
          const btn = el.closest('[data-dir]');
          if (btn && btn.dataset.dir) {
            return btn.dataset.dir;
          }
        }
        // Fallback: compute angle sector from D-Pad center
        const rect = dpad.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        if (Math.hypot(dx, dy) < 6) return null;
        if (Math.abs(dx) > Math.abs(dy)) {
          return dx > 0 ? 'right' : 'left';
        } else {
          return dy > 0 ? 'down' : 'up';
        }
      };

      const onDpadStart = (e) => {
        e.preventDefault();
        sound.init();
        dpadPointerId = e.pointerId;
        try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
        const dir = resolveDirectionFromPoint(e.clientX, e.clientY);
        setActiveDirection(dir);
      };

      const onDpadMove = (e) => {
        if (dpadPointerId !== e.pointerId) return;
        e.preventDefault();
        const dir = resolveDirectionFromPoint(e.clientX, e.clientY);
        setActiveDirection(dir);
      };

      const onDpadEnd = (e) => {
        if (dpadPointerId !== e.pointerId) return;
        e.preventDefault();
        dpadPointerId = null;
        setActiveDirection(null);
      };

      dpad.addEventListener('pointerdown', onDpadStart);
      dpad.addEventListener('pointermove', onDpadMove);
      dpad.addEventListener('pointerup', onDpadEnd);
      dpad.addEventListener('pointercancel', onDpadEnd);

      // Bomb Button (Independent pointer handling so multi-touch never conflicts)
      const btnBomb = document.getElementById('btnBomb');
      btnBomb.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        sound.init();
        btnBomb.classList.add('active-press');
        const userPlayer = gameState.players.find(p => !p.isAI);
        if (userPlayer && (gameState.phase === 'countdown' || gameState.phase === 'fadein' || gameState.phase === 'battle')) {
          placeBomb(userPlayer);
        }
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
        btnBomb.addEventListener(ev, () => btnBomb.classList.remove('active-press'));
      });

      // Weapon Button
      const btnWeapon = document.getElementById('btnWeapon');
      btnWeapon.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        sound.init();
        btnWeapon.classList.add('active-press');
        const userPlayer = gameState.players.find(p => !p.isAI);
        if (userPlayer && (gameState.phase === 'countdown' || gameState.phase === 'fadein' || gameState.phase === 'battle')) {
          useEquippedWeapon(userPlayer);
        }
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
        btnWeapon.addEventListener(ev, () => btnWeapon.classList.remove('active-press'));
      });

      // Keyboard support
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keyState.up = true;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keyState.down = true;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyState.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyState.right = true;
        if (e.key === ' ' || e.key === 'j' || e.key === 'J') {
          const userPlayer = gameState.players.find(p => !p.isAI);
          if (userPlayer) placeBomb(userPlayer);
        }
        if (e.key === 'k' || e.key === 'K' || e.key === 'Enter') {
          const userPlayer = gameState.players.find(p => !p.isAI);
          if (userPlayer) useEquippedWeapon(userPlayer);
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keyState.up = false;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keyState.down = false;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyState.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyState.right = false;
      });

      document.getElementById('btnCameraMode').addEventListener('click', () => {
        gameState.cameraMode = gameState.cameraMode === 'follow' ? 'full' : 'follow';
        document.getElementById('iconCameraFollow').classList.toggle('hidden', gameState.cameraMode !== 'follow');
        document.getElementById('iconCameraFull').classList.toggle('hidden', gameState.cameraMode !== 'full');
      });

      document.getElementById('btnAudioToggle').addEventListener('click', () => {
        const muted = sound.toggleMute();
        document.getElementById('iconSoundOn').classList.toggle('hidden', muted);
        document.getElementById('iconSoundOff').classList.toggle('hidden', !muted);
      });

      document.getElementById('btnStartGame').addEventListener('click', () => startMatch());
      document.getElementById('btnPlayAgain').addEventListener('click', () => startMatch());
      document.getElementById('btnChangeChar').addEventListener('click', () => {
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('flex');
        document.getElementById('topHud').classList.add('hidden');
        document.getElementById('bottomControls').classList.add('hidden');
        document.getElementById('selectScreen').classList.remove('hidden');
        gameState.phase = 'select';
      });
    }

    function updateWeaponButtonUI() {
      const userPlayer = gameState.players.find(p => !p.isAI);
      const btn = document.getElementById('btnWeapon');
      const iconEmpty = document.getElementById('weaponIconEmpty');
      const iconFlame = document.getElementById('weaponIconFlame');
      const iconThrow = document.getElementById('weaponIconThrow');
      const iconPower = document.getElementById('weaponIconPowerBomb');
      const dotsContainer = document.getElementById('weaponChargesDots');
      const powerBombRing = document.getElementById('powerBombRing');

      iconEmpty.classList.add('hidden');
      iconFlame.classList.add('hidden');
      iconThrow.classList.add('hidden');
      iconPower.classList.add('hidden');
      powerBombRing.classList.add('hidden');

      if (!userPlayer || !userPlayer.weapon || userPlayer.weaponCharges <= 0) {
        btn.classList.add('empty-weapon');
        iconEmpty.classList.remove('hidden');
        dotsContainer.classList.add('hidden');
        return;
      }

      btn.classList.remove('empty-weapon');
      if (userPlayer.weapon === 'flame') iconFlame.classList.remove('hidden');
      if (userPlayer.weapon === 'throwglove') iconThrow.classList.remove('hidden');
      if (userPlayer.weapon === 'powerbomb') {
        iconPower.classList.remove('hidden');
        powerBombRing.classList.remove('hidden');
      }

      dotsContainer.classList.remove('hidden');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < userPlayer.weaponCharges; i++) {
        const dot = document.createElement('span');
        dot.className = 'w-2 h-2 rounded-full bg-amber-300';
        dotsContainer.appendChild(dot);
      }
    }

    function updateTopStatusStrip() {
      const strip = document.getElementById('statusStrip');
      strip.innerHTML = '';
      gameState.players.forEach(p => {
        const pill = document.createElement('div');
        pill.className = `flex items-center gap-1 px-2.5 py-0.5 rounded-full border ${
          !p.alive
            ? 'bg-slate-900/50 border-slate-800 opacity-45'
            : !p.isAI
            ? 'bg-rose-950/85 border-rose-500/70'
            : 'bg-slate-900/85 border-slate-700/70'
        }`;

        const dot = document.createElement('span');
        dot.className = 'w-3 h-3 rounded-full shrink-0';
        dot.style.backgroundColor = p.charDef.primary;
        pill.appendChild(dot);

        const statusIcon = document.createElement('span');
        statusIcon.className = 'text-xs leading-none';
        if (!p.alive) {
          statusIcon.textContent = '👼';
        } else if (p.armor > 0) {
          statusIcon.textContent = p.armor > 1 ? `🦺×${p.armor}` : '🦺';
        } else {
          statusIcon.textContent = '❤️';
        }
        pill.appendChild(statusIcon);
        strip.appendChild(pill);
      });
    }

    // =========================================================================
    // 12. MAIN GAME UPDATE LOOP
    // =========================================================================
    function updateGame(dt) {
      if (gameState.phase === 'select' || gameState.phase === 'gameover') return;

      if (gameState.phase === 'countdown') {
        const prevSec = Math.ceil(gameState.countdownTimer);
        gameState.countdownTimer -= dt;
        const currSec = Math.max(0, Math.ceil(gameState.countdownTimer));
        if (currSec !== prevSec && currSec > 0) {
          document.getElementById('countdownNum').textContent = String(currSec);
          sound.playCountdownTick(currSec <= 3);
        }
        if (gameState.countdownTimer <= 0) {
          gameState.phase = 'fadein';
          gameState.fadeTimer = 0;
          document.getElementById('countdownBadge').classList.add('hidden');
          sound.playCountdownTick(true);
        }
      } else if (gameState.phase === 'fadein') {
        gameState.fadeTimer += dt;
        const progress = Math.min(1, gameState.fadeTimer / 1.8);
        gameState.players.forEach(p => {
          if (p.isAI) p.opacity = progress;
        });
        if (progress >= 1) {
          gameState.phase = 'battle';
        }
      }

      const userPlayer = gameState.players.find(p => !p.isAI);
      if (userPlayer && userPlayer.alive) {
        let vx = 0;
        let vy = 0;
        if (inputState.up || keyState.up) vy -= 1;
        if (inputState.down || keyState.down) vy += 1;
        if (inputState.left || keyState.left) vx -= 1;
        if (inputState.right || keyState.right) vx += 1;

        if (vx !== 0 || vy !== 0) {
          const len = Math.hypot(vx, vy);
          vx /= len;
          vy /= len;
          moveEntityWithCollision(userPlayer, vx * userPlayer.speed * dt, vy * userPlayer.speed * dt);
          userPlayer.dir = { x: vx, y: vy };
          userPlayer.isMoving = true;
          userPlayer.walkCycle += dt * 13.5;
        } else {
          userPlayer.isMoving = false;
        }
      }

      gameState.players.forEach(p => {
        if (p.bombCooldown > 0) p.bombCooldown = Math.max(0, p.bombCooldown - dt);
        if (p.weaponCooldown > 0) p.weaponCooldown = Math.max(0, p.weaponCooldown - dt);
        if (p.invulnTimer > 0) p.invulnTimer = Math.max(0, p.invulnTimer - dt);
        if (p.actionPoseTimer > 0) p.actionPoseTimer = Math.max(0, p.actionPoseTimer - dt);
        p.blinkTimer -= dt;
        if (p.blinkTimer <= -0.14) {
          p.blinkTimer = 2.4 + Math.random() * 2.5;
        }
      });

      if (gameState.phase === 'battle') {
        updateDangerBuffer();
        for (let i = 0; i < gameState.players.length; i++) {
          const p = gameState.players[i];
          if (p.isAI && p.alive) {
            updateAI(p, dt);
          }
        }

        gameState.airdropTimer += dt;
        if (gameState.airdropTimer >= 10.0) {
          gameState.airdropTimer -= 10.0;
          triggerSkyDrop();
        }
      }

      for (let i = gameState.skyDrops.length - 1; i >= 0; i--) {
        const sd = gameState.skyDrops[i];
        sd.z -= sd.fallSpeed * dt;
        sd.swayPhase += dt * 5;
        if (sd.z <= 0) {
          if (!gameState.items.some(it => it.col === sd.col && it.row === sd.row)) {
            gameState.items.push({
              col: sd.col,
              row: sd.row,
              type: sd.type,
              bobPhase: Math.random() * Math.PI * 2,
              spawnScale: 0.25
            });
          }
          sound.playAirdropLand();
          for (let k = 0; k < 8; k++) {
            const ang = (Math.PI * 2 * k) / 8;
            gameState.particles.push({
              x: sd.x,
              y: sd.y,
              vx: Math.cos(ang) * 55,
              vy: Math.sin(ang) * 55,
              r: 3,
              color: '#38bdf8',
              life: 0.3,
              maxLife: 0.3
            });
          }
          gameState.skyDrops.splice(i, 1);
        }
      }

      gameState.items.forEach(it => {
        if (it.spawnScale < 1) {
          it.spawnScale = Math.min(1, it.spawnScale + dt * 5);
        }
      });

      for (let i = gameState.thrownBombs.length - 1; i >= 0; i--) {
        const tb = gameState.thrownBombs[i];
        tb.progress += dt / tb.flightDuration;
        if (tb.progress >= 1) {
          gameState.bombs.push({
            col: tb.targetCol,
            row: tb.targetRow,
            x: tb.targetX,
            y: tb.targetY,
            ownerId: tb.ownerId,
            ownerIsAI: tb.ownerIsAI,
            radius: tb.radius,
            isPower: tb.isPower,
            timer: tb.remainingFuse,
            maxTimer: 2.25,
            passThroughIds: []
          });
          sound.playPlaceBomb();
          gameState.thrownBombs.splice(i, 1);
        } else {
          tb.x = tb.startX + (tb.targetX - tb.startX) * tb.progress;
          tb.y = tb.startY + (tb.targetY - tb.startY) * tb.progress;
          tb.z = Math.sin(tb.progress * Math.PI) * 105;
        }
      }

      for (let i = gameState.bombs.length - 1; i >= 0; i--) {
        const b = gameState.bombs[i];
        b.timer -= dt;
        if (b.timer <= 0) {
          gameState.bombs.splice(i, 1);
          detonateBomb(b);
        }
      }

      for (let i = gameState.explosions.length - 1; i >= 0; i--) {
        const ex = gameState.explosions[i];
        ex.timer -= dt;
        if (gameState.phase === 'battle' && ex.timer > ex.maxTimer * 0.25) {
          gameState.players.forEach(p => {
            if (p.alive && ex.cells.some(c => c.col === p.col && c.row === p.row)) {
              applyHitToPlayer(p, ex.ownerId);
            }
          });
        }
        if (ex.timer <= 0) {
          gameState.explosions.splice(i, 1);
        }
      }

      for (let i = gameState.flameStreams.length - 1; i >= 0; i--) {
        const fs = gameState.flameStreams[i];
        fs.timer -= dt;
        if (gameState.phase === 'battle' && fs.timer > 0.1) {
          gameState.players.forEach(p => {
            if (p.alive && p.id !== fs.ownerId && fs.cells.some(c => c.col === p.col && c.row === p.row)) {
              applyHitToPlayer(p, fs.ownerId);
            }
          });
        }
        if (fs.timer <= 0) {
          gameState.flameStreams.splice(i, 1);
        }
      }

      for (let i = gameState.detachedArmors.length - 1; i >= 0; i--) {
        const da = gameState.detachedArmors[i];
        da.life -= dt;
        da.x += da.vx * dt;
        da.y += da.vy * dt;
        da.vx *= 0.94;
        da.vy *= 0.94;
        da.z += da.vz * dt;
        da.vz -= 480 * dt;
        if (da.z < 0) {
          da.z = 0;
          da.vz = Math.abs(da.vz) * 0.42;
          da.vRot *= 0.6;
        }
        da.rot += da.vRot * dt;
        da.splitProgress = Math.min(1, (da.maxLife - da.life) * 1.4);
        if (da.life <= 0) {
          gameState.detachedArmors.splice(i, 1);
        }
      }

      for (let i = gameState.ascensions.length - 1; i >= 0; i--) {
        const asc = gameState.ascensions[i];
        asc.timer += dt;
        asc.y = asc.startY - asc.timer * 65;
        if (asc.timer >= asc.duration) {
          gameState.ascensions.splice(i, 1);
        }
      }

      for (let i = gameState.particles.length - 1; i >= 0; i--) {
        const pt = gameState.particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        if (pt.rot !== undefined) pt.rot += (pt.vRot || 0) * dt;
        pt.life -= dt;
        if (pt.life <= 0) {
          gameState.particles.splice(i, 1);
        }
      }

      gameState.dustMotes.forEach(m => {
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        if (m.y < 0) m.y = GRID_ROWS * TILE_SIZE;
        if (m.x < 0) m.x = GRID_COLS * TILE_SIZE;
        if (m.x > GRID_COLS * TILE_SIZE) m.x = 0;
      });
    }

    // =========================================================================
    // 13. HIGH-DEFINITION CHARACTER ANATOMY & FURNITURE RENDERING
    //     - Explicitly renders:
    //       1. Trousers/Pants (褲子: distinct left & right trouser legs + knee bend!)
    //       2. Shoes/Boots (鞋子: soles, heels, toe caps & gold buckles!)
    //       3. Layered Clothing (服裝層次: inner shirt collar, waistcoat/vest, outer coat lapels, belt, coat tails!)
    //       4. Palms & 5 Articulated Fingers (手掌與手指: visible palm + thumb & fingers!)

    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const camera = { x: 0, y: 0, zoom: 1.0 };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawIndestructiblePillar(ctx, c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const s = TILE_SIZE;

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.beginPath();
      ctx.ellipse(x + s / 2 + 4, y + s / 2 + 10, s * 0.45, s * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(x + 5, y + 7, s - 10, s - 10, 7);
      ctx.fill();
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 7, y + 9, s - 14, s - 14);

      const colGrad = ctx.createRadialGradient(x + s * 0.38, y + s * 0.35, 3, x + s / 2, y + s / 2, s * 0.38);
      colGrad.addColorStop(0, '#f8fafc');
      colGrad.addColorStop(0.55, '#94a3b8');
      colGrad.addColorStop(1, '#334155');
      ctx.fillStyle = colGrad;
      ctx.beginPath();
      ctx.arc(x + s / 2, y + s / 2 - 2, s * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(x + s / 2, y + s / 2 - 2, s * 0.23, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }
